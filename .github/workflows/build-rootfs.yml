name: 编译RootFS(Debian+Netplan+SSH/FTP/Nginx/PHP8)

on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: 'Debian 套件(bookworm = PHP 8.2)'
        required: false
        default: 'bookworm'
  push:
    tags:
      - 'rootfs-*'

permissions:
  contents: write

env:
  DEBIAN_SUITE: ${{ github.event.inputs.debian_suite || 'bookworm' }}
  ROOTFS_DIR: ${{ github.workspace }}/rootfs
  OUT_DIR: ${{ github.workspace }}/out

jobs:
  build-rootfs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘约 14GB，先腾空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring gnupg dirmngr

      - name: Ensure bookworm archive key present
        run: |
          if ! gpg --show-keys --with-fingerprint /usr/share/keyrings/debian-archive-keyring.gpg 2>/dev/null | grep -q "F8D2 585B 8783 D481"; then
            sudo mkdir -p /root/.gnupg
            sudo chmod 700 /root/.gnupg
            sudo gpg --homedir /root/.gnupg \
                     --no-default-keyring \
                     --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
                     --keyserver keyserver.ubuntu.com \
                     --recv-keys 4D64FEC119C2029067D6E791F8D2585B8783D481
          fi

      - name: Debootstrap base system
        run: |
          sudo mkdir -p "$ROOTFS_DIR"
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=systemd,systemd-sysv,dbus,ca-certificates,openssh-server,vsftpd,nginx,php8.2-cgi,php8.2-fpm,php8.2-mysql,procps,iproute2,iputils-ping,net-tools,vim,curl,wget,netplan.io,systemd-resolved,initramfs-tools,kmod,grub-pc,grub-efi-amd64 \
            "$DEBIAN_SUITE" "$ROOTFS_DIR" \
            http://deb.debian.org/debian/

      - name: Configure APT sources
        run: |
          sudo tee "$ROOTFS_DIR/etc/apt/sources.list" > /dev/null <<EOF
          deb http://deb.debian.org/debian ${DEBIAN_SUITE} main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian ${DEBIAN_SUITE}-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security ${DEBIAN_SUITE}-security main contrib non-free non-free-firmware
          EOF

      - name: Configure netplan (DHCP dynamic IP)
        run: |
          # 禁用可预测网卡名，统一使用 eth0，避免 netplan 匹配不上
          sudo mkdir -p "$ROOTFS_DIR/etc/systemd/network"
          sudo ln -sf /dev/null "$ROOTFS_DIR/etc/systemd/network/99-default.link"

          # netplan 配置：DHCP 动态获取 IPv4
          sudo mkdir -p "$ROOTFS_DIR/etc/netplan"
          sudo tee "$ROOTFS_DIR/etc/netplan/01-netcfg.yaml" > /dev/null <<'EOF'
          network:
            version: 2
            renderer: networkd
            ethernets:
              eth0:
                dhcp4: true
                dhcp6: false
                optional: true
          EOF

          # netplan 要求配置文件权限为 600
          sudo chmod 600 "$ROOTFS_DIR/etc/netplan/01-netcfg.yaml"

      - name: Configure rootfs (chroot)
        run: |
          # 准备 chroot 所需挂载
          sudo mount --bind /dev  "$ROOTFS_DIR/dev"
          sudo mount --bind /proc "$ROOTFS_DIR/proc"
          sudo mount --bind /sys  "$ROOTFS_DIR/sys"

          # 让 resolv.conf 由 systemd-resolved 接管（DHCP 下发的 DNS 才会生效）
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf "$ROOTFS_DIR/etc/resolv.conf"

          # 初始密码 1234，并强制首次登录修改
          echo "root:1234" | sudo chroot "$ROOTFS_DIR" /usr/sbin/chpasswd
          sudo chroot "$ROOTFS_DIR" chage -d 0 root

          # 允许 root SSH 登录（首次登录会强制改密）
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' \
            "$ROOTFS_DIR/etc/ssh/sshd_config"

          # vsftpd：允许本地用户登录并上传
          # 注意：密码过期期间 FTP 会拒绝登录，需先通过 SSH 改密
          echo "local_enable=YES"  | sudo tee -a "$ROOTFS_DIR/etc/vsftpd.conf"
          echo "write_enable=YES"  | sudo tee -a "$ROOTFS_DIR/etc/vsftpd.conf"

          # PHP CGI 路径修复
          sudo sed -i 's/^;*cgi.fix_pathinfo.*/cgi.fix_pathinfo=1/' \
            "$ROOTFS_DIR/etc/php/8.2/cgi/php.ini" || true

          # 启用服务开机自启
          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-networkd            || true
          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-networkd-wait-online || true
          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-resolved            || true
          sudo chroot "$ROOTFS_DIR" systemctl enable nginx php8.2-fpm ssh vsftpd || true

          # 首次开机生成 netplan 后端配置（可选，保险起见）
          sudo chroot "$ROOTFS_DIR" netplan generate || true

          # 验证 apt 可用（模拟安装，不实际改动）
          sudo chroot "$ROOTFS_DIR" bash -c "apt-get update && apt-get -s install -y curl >/dev/null" || true

          # 清理 apt 缓存
          sudo chroot "$ROOTFS_DIR" apt-get clean
          sudo rm -rf "$ROOTFS_DIR/var/lib/apt/lists/"*

          # 卸载挂载点
          sudo umount "$ROOTFS_DIR/dev"  || true
          sudo umount "$ROOTFS_DIR/proc" || true
          sudo umount "$ROOTFS_DIR/sys"  || true

      - name: Package rootfs
        run: |
          mkdir -p "$OUT_DIR"
          sudo tar --numeric-owner -zcf "$OUT_DIR/rootfs.tar.gz" -C "$ROOTFS_DIR" .
          ls -lh "$OUT_DIR/rootfs.tar.gz"

          # 生成校验文件
          ( cd "$OUT_DIR" && sha256sum rootfs.tar.gz > rootfs.tar.gz.sha256 )

          # 若超过 1.9GB，拆分成多个小于 2GB 的分片
          SIZE=$(stat -c%s "$OUT_DIR/rootfs.tar.gz")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            cd "$OUT_DIR"
            split -b 1900m rootfs.tar.gz rootfs.tar.gz.part-
            rm -f rootfs.tar.gz
            ls -lh
          fi

      - name: Verify output files
        run: |
          ls -lh "$OUT_DIR"
          test -f "$OUT_DIR/rootfs.tar.gz" || test -f "$OUT_DIR/rootfs.tar.gz.part-aa"

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          tag: rootfs-${{ env.DEBIAN_SUITE }}-lastlet
          name: rootfs-${{ env.DEBIAN_SUITE }}-lastlet
          artifacts: ${{ env.OUT_DIR }}/*
          body: |
            Debian ${{ env.DEBIAN_SUITE }} rootfs (x86_64)
            包含：openssh-server / vsftpd / nginx / php8.2-cgi / php8.2-fpm
            
            **初始 root 密码：`1234`**
            首次通过 SSH 登录会强制要求修改密码；FTP 需在改密后才能登录。
            若下载到的是 rootfs.tar.gz，直接解压：
              tar -xzf rootfs.tar.gz -C /目标分区
            若下载到的是 rootfs.tar.gz.part-* 分片，先合并：
              cat rootfs.tar.gz.part-* > rootfs.tar.gz
              sha256sum -c rootfs.tar.gz.sha256
