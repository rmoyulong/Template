name: 编译Bootable IMG (MBR兼容版)

on:
  workflow_dispatch:
  push:
    tags:
      - 'img-*'

permissions:
  contents: write

env:
  KERNEL_VERSION: '6.12.115'
  IMG_SIZE_MB: 4096
  WORK_DIR: ${{ github.workspace }}/work
  IMG_FILE: ${{ github.workspace }}/work/debian-rootfs.img
  ROOTFS_URL: https://github.com/rmoyulong/Template/releases/download/rootfs-bookworm-latest/rootfs.tar.gz
  MODULES_URL: https://github.com/rmoyulong/Template/releases/download/kernel-modules-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8/modules.tar.gz
  BZIMAGE_URL: https://github.com/rmoyulong/Template/releases/download/kernel-image-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8/bzImage

jobs:
  build-img:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget parted e2fsprogs dosfstools mtools xorriso rsync \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub-common

      - name: Download files
        run: |
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          wget -q -O rootfs.tar.gz "$ROOTFS_URL"
          wget -q -O modules.tar.gz "$MODULES_URL"
          wget -q -O bzImage "$BZIMAGE_URL"

      - name: Create disk image (MBR + EFI + EXT4)
        run: |
          cd "$WORK_DIR"
          dd if=/dev/zero of="$IMG_FILE" bs=1M count=$IMG_SIZE_MB status=progress

          # MBR 分区表，最大程度兼容老主板
          parted -s "$IMG_FILE" mklabel msdos
          # p1: 200MB FAT32 用于 EFI 引导
          parted -s "$IMG_FILE" mkpart primary fat32 1MiB 201MiB
          parted -s "$IMG_FILE" set 1 boot on
          # p2: 剩余空间 EXT4 用于根文件系统
          parted -s "$IMG_FILE" mkpart primary ext4 201MiB 100%

          LOOP=$(sudo losetup --find --show --partscan "$IMG_FILE")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sleep 2

          sudo mkfs.vfat -F32 "${LOOP}p1"
          sudo mkfs.ext4 -F -L rootfs "${LOOP}p2"

      - name: Populate rootfs
        run: |
          LOOP="${{ env.LOOP }}"
          sudo mkdir -p /mnt/rootfs /mnt/efi
          sudo mount "${LOOP}p2" /mnt/rootfs
          sudo mount "${LOOP}p1" /mnt/efi

          # 解压到 EXT4 分区，不再报 symlink/权限 错误
          sudo tar -xzf "$WORK_DIR/rootfs.tar.gz" -C /mnt/rootfs --numeric-owner

          # 放入安装脚本
          INSTALLER_SRC="${{ github.workspace }}/patch/install.sh"
          if [ -f "$INSTALLER_SRC" ]; then
            sudo mkdir -p /mnt/rootfs/root
            sudo cp "$INSTALLER_SRC" /mnt/rootfs/root/install.sh
            sudo chmod 755 /mnt/rootfs/root/install.sh
            sudo sed -i 's/\r$//' /mnt/rootfs/root/install.sh
          fi

          # 解压 modules
          rm -rf /tmp/modules-extract
          mkdir -p /tmp/modules-extract
          sudo tar -xzf "$WORK_DIR/modules.tar.gz" -C /tmp/modules-extract
          VERSION_DIR=$(sudo find /tmp/modules-extract -maxdepth 4 -type d -name "${KERNEL_VERSION}" -print -quit)
          sudo mkdir -p /mnt/rootfs/lib/modules
          sudo mv "$VERSION_DIR" "/mnt/rootfs/lib/modules/${KERNEL_VERSION}"

          # 内核
          sudo mkdir -p /mnt/rootfs/boot
          sudo cp "$WORK_DIR/bzImage" "/mnt/rootfs/boot/vmlinuz-${KERNEL_VERSION}"

      - name: Generate initramfs and install GRUB
        run: |
          LOOP="${{ env.LOOP }}"
          sudo mount --bind /dev /mnt/rootfs/dev
          sudo mount --bind /proc /mnt/rootfs/proc
          sudo mount --bind /sys /mnt/rootfs/sys

          # 伪造 config 以生成 initramfs
          sudo tee "/mnt/rootfs/boot/config-${KERNEL_VERSION}" > /dev/null <<'EOF'
          CONFIG_RD_GZIP=y
          EOF
          echo "COMPRESS=gzip" | sudo tee /mnt/rootfs/etc/initramfs-tools/initramfs.conf
          
          sudo chroot /mnt/rootfs /bin/bash -c "depmod -a ${KERNEL_VERSION}"
          sudo chroot /mnt/rootfs /bin/bash -c "update-initramfs -c -k ${KERNEL_VERSION}"

          # fstab
          sudo tee /mnt/rootfs/etc/fstab > /dev/null <<'EOF'
          LABEL=rootfs  /  ext4  errors=remount-ro  0  1
          EOF

          # 安装 GRUB
          sudo chroot /mnt/rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update || true
            apt-get install -y grub-pc grub-efi-amd64 grub-efi-ia32 || true
            
            # BIOS 模式：写入 MBR
            grub-install --target=i386-pc --recheck ${LOOP} || true
            
            # UEFI 模式：写入 p1 分区 (挂载在 /boot/efi)
            mkdir -p /boot/efi
            mount ${LOOP}p1 /boot/efi
            grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=debian --recheck || true
            grub-install --target=i386-efi --efi-directory=/boot/efi --bootloader-id=debian --recheck || true
          "

          # 确保 fallback BOOTIA32.EFI 存在 (针对 Bay Trail)
          sudo mkdir -p /mnt/efi/EFI/BOOT
          if [ -f /mnt/efi/EFI/debian/grubia32.efi ]; then
            sudo cp /mnt/efi/EFI/debian/grubia32.efi /mnt/efi/EFI/BOOT/BOOTIA32.EFI
          fi
          if [ -f /mnt/efi/EFI/debian/grubx64.efi ]; then
            sudo cp /mnt/efi/EFI/debian/grubx64.efi /mnt/efi/EFI/BOOT/BOOTX64.EFI
          fi

          # 写 grub.cfg
          sudo mkdir -p /mnt/rootfs/boot/grub
          sudo tee /mnt/rootfs/boot/grub/grub.cfg > /dev/null <<EOF
          set default=0
          set timeout=5
          menuentry "Debian Linux" {
              linux /boot/vmlinuz-${KERNEL_VERSION} root=LABEL=rootfs rw quiet
              initrd /boot/initrd.img-${KERNEL_VERSION}
          }
          EOF

          # 复制 grub.cfg 到 EFI 分区
          sudo mkdir -p /mnt/efi/EFI/debian
          sudo cp /mnt/rootfs/boot/grub/grub.cfg /mnt/efi/EFI/debian/grub.cfg 2>/dev/null || true
          sudo cp /mnt/rootfs/boot/grub/grub.cfg /mnt/efi/EFI/BOOT/grub.cfg 2>/dev/null || true

          sudo umount /mnt/rootfs/dev /mnt/rootfs/proc /mnt/rootfs/sys || true

      - name: Cleanup and Compress
        run: |
          LOOP="${{ env.LOOP }}"
          sudo umount /mnt/rootfs || true
          sudo umount /mnt/efi || true
          sudo losetup -d "$LOOP" || true
          cd "$WORK_DIR"
          gzip -9 -k "$IMG_FILE"
          ( cd "$WORK_DIR" && sha256sum debian-rootfs.img.gz > debian-rootfs.img.gz.sha256 )

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          tag: image-debian-MBR-latest
          name: image-debian-MBR-latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            ${{ env.WORK_DIR }}/debian-rootfs.img.gz
            ${{ env.WORK_DIR }}/debian-rootfs.img.gz.sha256
          body: |
            Debian IMG (MBR兼容版)
            初始 root 密码：`1234`
            
            ## 写入 U 盘或硬盘
            
            先确认目标设备（把 `sdX` 换成实际盘符，如 `sdb`）：
            ```bash
            lsblk -o NAME,SIZE,MODEL,TRAN,MOUNTPOINT
            sudo umount /dev/sdX?* 2>/dev/null || true
            gunzip -c debian-rootfs.img.gz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
            sudo sync
            
            ## 将系统安装到机器硬盘（U盘启动后运行）
            ```bash
            sudo sh /root/install.sh            