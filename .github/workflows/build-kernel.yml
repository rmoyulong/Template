name: 构建 Linux 内核 - x86_64

on:
  workflow_dispatch: # 允许在 Actions 页面手动触发
    inputs:
      allow_degraded:
        description: '容错模式：配置降级（=m 非 0 / 品牌 HID 缺失）时只告警不失败'
        type: boolean
        default: false

env:
  KERNEL_VERSION: 7.3.4

jobs:
  build_kernel:
    name: ${{ matrix.config_type }} 编译
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- RT 全内建：所有驱动编进 bzImage，部署只需一个文件 ----
          - config_type: RT实时内核
            tag: rt
            fragment: patch/j1900andj1800-RT.config
            mode: 全内建（所有驱动编入 bzImage，modules 包只含元数据）
          # ---- RT 模块化：关键驱动内建，其余走模块 ----
          - config_type: RT实时内核-模块化
            tag: rt-mod
            fragment: patch/j1900andj1800-RT-modular.config
            mode: 关键驱动内建 + 其余模块化（需同时安装 modules.tar.gz）
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘约 14GB，编译内核（源码+产物）需 10GB 以上，
      # 两个矩阵任务并行更容易爆盘，先腾空间
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: 切换 Ubuntu APT 镜像源
        run: |
          set -euo pipefail
          
            echo "===== ORIGINAL APT SOURCES ====="
            cat /etc/apt/sources.list.d/ubuntu.sources
            # 绕过 GitHub Runner 默认的 Azure mirror list
            sudo sed -i -E \
              's|mirror\+file:/etc/apt/apt-mirrors\.txt|https://mirrors.tuna.tsinghua.edu.cn/ubuntu/|g; s|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://mirrors.tuna.tsinghua.edu.cn/ubuntu/|g' \
              /etc/apt/sources.list.d/ubuntu.sources
            echo "===== UPDATED APT SOURCES ====="
            cat /etc/apt/sources.list.d/ubuntu.sources
            
      - name: 安装构建依赖项
        run: |
          set -euo pipefail
          
            echo "===== 带重试机制的 APT 更新 ====="
            for attempt in 1 2 3 4 5; do
              echo "尝试执行 APT 更新: $attempt"
              
              if sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update; then
                break
              fi
              
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::APT 更新在尝试 5 次后失败"
                exit 1
              fi
              
              sleep 20
            done
            
            echo "===== 安装构建依赖项S ====="
            sudo apt-get install -y \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              build-essential \
              libncurses-dev \
              bison \
              flex \
              libssl-dev \
              libelf-dev \
              bc \
              xz-utils \
              zstd \
              cpio \
              dwarves \
              kmod \
              perl \
              python3 \
              rsync \
              wget \
              git

      - name: 下载内核源码
        run: |
          set -euo pipefail
          # 主版本号自动推导，绝不能把 v6.x / v7.x 写死：
          # 7.x 内核位于 v7.x/ 目录下，写死 v6.x 会直接 404
          # （这正是"7.4 下载不下来"的根因）。
          MAJOR="${KERNEL_VERSION%%.*}"
          BASE="https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x"
          # 候选版（-rc）放在 testing/ 子目录，正式版在上一层
          case "$KERNEL_VERSION" in
            *-rc*) BASE="$BASE/testing" ;;
          esac
          URL="$BASE/linux-${KERNEL_VERSION}.tar.xz"
          echo "下载地址: $URL"
          wget -q "$URL"
          tar -xJf "linux-${KERNEL_VERSION}.tar.xz"
          ls -d "linux-${KERNEL_VERSION}"

      - name: 配置内核
        working-directory: linux-${{ env.KERNEL_VERSION }}
        run: |
          set -euo pipefail

          FRAGMENT="${{ github.workspace }}/${{ matrix.fragment }}"
          test -f "$FRAGMENT" || { echo "::error::缺少配置片段 $FRAGMENT"; exit 1; }

          # ============================================================
          # 正确的配置流程：
          #   1) 先用 x86_64_defconfig 生成一份可启动、完整的基础配置
          #      （官方维护的 x86_64 默认配置，约 1700 个 =y/=m 条目）
          #   2) 再用 merge_config.sh 在其基础上叠加我们的定制片段
          #      （自动处理依赖冲突）
          #   3) 关证书项，最后 olddefconfig 做一次依赖补齐
          # 绝不能只 cp 一份残缺配置就 olddefconfig，否则父选项没触发、
          # 子系统整块没进来，条目数只有 1200+。
          # ============================================================
          
          # 1) 从官方 x86_64 默认配置起步（约 1700 个 =y/=m 条目，完整可启动）
          make x86_64_defconfig
          COUNT0=$(grep -c '^CONFIG_[A-Za-z0-9_]\+=' .config)
          echo "defconfig 条目数: $COUNT0"
          
          # 2) 合并我们的增量配置片段（只写需要修改/额外开启的选项）
          ./scripts/kconfig/merge_config.sh -m -O . .config "$FRAGMENT"
          
          # 3) 禁用证书相关选项，避免构建时报签名错误
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          scripts/config --disable MODULE_SIG_ALL
          scripts/config --disable MODULE_SIG_FORCE
          
          # Apply confirmed Daphile configuration.
          
          echo
          echo "===== APPLY CONFIRMED CONFIGURATION ====="
          
          ./scripts/config --enable EXPERT
          ./scripts/config --enable X86_64
          ./scripts/config --enable SMP
          ./scripts/config --enable PCI
          ./scripts/config --enable INPUT
          ./scripts/config --enable MODULES
          ./scripts/config --enable MODULE_UNLOAD
          
          # PREEMPT_RT.
          
          ./scripts/config --enable PREEMPT_RT
          ./scripts/config --enable HIGH_RES_TIMERS
          
          # ALSA core: built-in.
          
          ./scripts/config --enable SOUND
          ./scripts/config --enable SND
          ./scripts/config --enable SND_PCM
          ./scripts/config --enable SND_TIMER
          ./scripts/config --enable SND_HRTIMER
          ./scripts/config --enable SND_ALOOP
          ./scripts/config --enable SND_PCI
          
          # Intel HDA stack: modules.
          if [ "${{ matrix.tag }}" = "rt-mod" ]; then
              ./scripts/config --module SND_HDA
              ./scripts/config --module SND_HDA_CORE
              ./scripts/config --module SND_HDA_INTEL
              ./scripts/config --module SND_HDA_GENERIC
              ./scripts/config --module SND_HDA_CODEC_REALTEK
              ./scripts/config --module SND_HDA_CODEC_HDMI
              ./scripts/config --module SND_INTEL_DSP_CONFIG
          else
              ./scripts/config --enable SND_HDA
              ./scripts/config --enable SND_HDA_CORE
              ./scripts/config --enable SND_HDA_INTEL
              ./scripts/config --enable SND_HDA_GENERIC
              ./scripts/config --enable SND_HDA_CODEC_REALTEK
              ./scripts/config --enable SND_HDA_CODEC_HDMI
              ./scripts/config --enable SND_INTEL_DSP_CONFIG          
          fi
          
          # Kernel compression: ZSTD.
          
          ./scripts/config --enable KERNEL_ZSTD
          
          # Kernel version suffix.
          # Set suffix ONLY in .config.
          # Do NOT pass LOCALVERSION to make later.
         
          # Resolve Kconfig dependencies.
          
          echo
          echo "===== KCONFIG OLDDEFCONFIG ====="
          
          make olddefconfig
          
          # 4) 最后一次依赖补齐，并让 kconfig 报告写错的符号名
          KCONFIG_WARN_UNKNOWN_SYMBOLS=1 make olddefconfig

          # ---- 配置自检 ----
          # 说明：x86_64_defconfig 本身约 1700 个 =y/=m 条目（其余是
          # "# CONFIG_xxx is not set" 行，不计入），合并增量后约 1800+，
          # 因此阈值定 1500：低于它说明配置基本没生效。
          LINES=$(grep -c '^CONFIG_[A-Za-z0-9_]\+=' .config)
          echo "生效的 CONFIG_ 条目数: $LINES"
          if [ "$LINES" -lt 1500 ]; then
            echo "::error::.config 条目数异常（应 > 1500，实际 $LINES），配置可能没有生效" >&2
            exit 1
          fi

          # 模块数量统计
          MODCOUNT=$(grep -c '=m$' .config || true)
          BUILTIN=$(grep -c '=y$' .config || true)
          echo "编成模块(=m)的条目数: $MODCOUNT"
          echo "内建(=y)的条目数: $BUILTIN"
          if [ "$MODCOUNT" -gt 0 ]; then
            echo "---- =m 条目明细（全内建版应为 0；若非 0 说明有驱动漏改成 =y）----"
            grep -E '^CONFIG_[A-Za-z0-9_]+=m$' .config | sed 's/^/    /' | head -40
          fi

          # 容错开关：默认 false（严格）。置 true 时，仅把"配置降级"类问题降为
          # 告警，方便在内核大版本升级、依赖链变动时先跑通再逐项修。
          # 注意：关键驱动（CRITICAL）永远硬失败，不受此开关影响。
          ALLOW_DEGRADED="${{ github.event.inputs.allow_degraded }}"

          if [ "${{ matrix.tag }}" = "rt-mod" ]; then
            # 模块化内核：=m 必须达到一定数量，否则说明片段没生效
            if [ "$MODCOUNT" -lt 50 ]; then
              echo "::error::本配置应为模块化内核，但 =m 条目数仅 $MODCOUNT（应 > 50），配置可能没生效" >&2
              exit 1
            fi
            echo "本配置为模块化：关键驱动内建，其余走模块（=m）"
          else
            # 全内建内核：=m 必须为 0，出现任何一个都说明有驱动漏改成 =y。
            # 这是构建期硬闸门：将来任何人（含自己）清理配置时误加 =m，CI 当场
            # 失败并列出明细，不会悄悄混进 bzImage 之外的模块包。
            #
            # 判定用 CONFIG_LOCALVERSION 精确等于 "-rt"：不能简单 grep "-rt"，
            # 否则会误命中模块化版的 "-rt-mod"。同时校验标签与片段一致，
            # 防止"用模块化片段跑 rt 任务"这类错配。
            LV="$(grep -E '^CONFIG_LOCALVERSION=' .config | head -1 | sed -E 's/^CONFIG_LOCALVERSION=//; s/^"//; s/"$//')"
            if [ "${{ matrix.tag }}" != "rt" ]; then
              echo "提示：本配置无 =m 模块"
            elif [ "$LV" != "-rt" ]; then
              echo "::error::全内建版标签为 rt，但 CONFIG_LOCALVERSION 为 \"$LV\"（期望 \"-rt\"），配置片段可能用错" >&2
              exit 1
            elif [ "$MODCOUNT" -gt 0 ]; then
              echo "---- 全内建版出现 =m 明细（应在片段中改为 =y，或显式关闭）----" >&2
              grep -E '^CONFIG_[A-Za-z0-9_]+=m$' .config | sed 's/^/    /' >&2
              if [ "$ALLOW_DEGRADED" = "true" ]; then
                echo "::warning::容错模式已开启：全内建版出现 $MODCOUNT 个 =m，本次只告警不失败" >&2
              else
                echo "::error::全内建版（CONFIG_LOCALVERSION=-rt）不允许出现任何 =m，实际有 $MODCOUNT 个；请在配置片段中改为 =y（或临时开启容错模式）" >&2
                exit 1
              fi
            else
              echo "提示：本配置为全内建（无 =m 模块），modules.tar.gz 将只含元数据，属正常现象"
            fi
          fi

          echo "==================== 关键配置自检（仅打印） ===================="
          for k in CONFIG_LOCALVERSION CONFIG_PREEMPT_RT CONFIG_HZ CONFIG_MODULES \
                   CONFIG_SND CONFIG_SND_HDA_INTEL CONFIG_SND_HDA_CODEC_REALTEK \
                   CONFIG_NET CONFIG_INET CONFIG_VFAT_FS CONFIG_EFI \
                   CONFIG_IWLWIFI CONFIG_TCP_CONG_BBR CONFIG_DEFAULT_TCP_CONG; do
            if grep -qE "^${k}=" .config; then
              grep -E "^${k}=" .config
            else
              echo "  # ${k} is not set"
            fi
          done
          echo "============================================================="

          # ---- 关键驱动强制校验：必须内建（=y）----
          # 这些是保证"能启动 + 能打字 + 有网 + 有显示"的最小集合。
          # 若符号名写错、或依赖没满足，olddefconfig 会将其变成 not set，
          # 这里会直接报错拦下 —— 避免装到机器上才发现键盘不可用。
          echo "==================== 关键驱动强制校验 ===================="
          CRITICAL="CONFIG_USB CONFIG_USB_XHCI_HCD CONFIG_USB_EHCI_HCD \
                    CONFIG_USB_HID CONFIG_HID_GENERIC CONFIG_INPUT_EVDEV \
                    CONFIG_KEYBOARD_ATKBD CONFIG_VT_CONSOLE CONFIG_TTY \
                    CONFIG_USB_STORAGE CONFIG_R8169 CONFIG_EXT4_FS"
          MISSING=""
          for k in $CRITICAL; do
            if grep -qE "^${k}=y$" .config; then
              echo "  [OK]   ${k}=y"
            else
              echo "  [FAIL] ${k} 不是 =y（当前：$(grep -E "^${k}=" .config || echo '未设置')）"
              MISSING="$MISSING $k"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::关键驱动未内建（=y），会导致启动/键盘/网络异常：$MISSING" >&2
            exit 1
          fi
          echo "========================================================="

          # ---- 家用外设品牌 HID 驱动断言 ----
          # 背景：HID_LOGITECH 依赖 LEDS_CLASS，而 LEDS_CLASS 定义在 `if NEW_LEDS`
          # 内部。若 NEW_LEDS 被误删或置 n，下面这些品牌驱动会被静默忽略（写了
          # 等于没写），肉眼在片段里看不出来，装到机器上才发现罗技无线鼠标滚轮
          # 失灵。这里在构建期就拦下。
          # 【7.3 起】HID_LOGITECH 又多了一条 `depends on LEDS_CLASS_MULTICOLOR`；
          # 漏掉它同样会让 HID_LOGITECH / _DJ / _HIDPP 整组被丢弃，因此把
          # LEDS_CLASS_MULTICOLOR 也纳入断言（两份 config 片段里均已写入）。
          # 策略差异：全内建版为 =y，模块化版为 =m，故品牌驱动只要求"不是 n"。
          if grep -qE '^CONFIG_NEW_LEDS=y$' .config; then
            echo "[OK]   CONFIG_NEW_LEDS=y（LEDS_CLASS 可见性前提）"
          elif [ "$ALLOW_DEGRADED" = "true" ]; then
            echo "::warning::容错模式：CONFIG_NEW_LEDS 不是 =y，品牌 HID 驱动会被静默忽略" >&2
          else
            echo "::error::CONFIG_NEW_LEDS 不是 =y，HID_LOGITECH 等品牌驱动会被静默忽略" >&2
            exit 1
          fi
          # 说明：LEDS_CLASS_MULTICOLOR 是 7.3 给 HID_LOGITECH 新加的依赖，
          # 已并入下面的 BRAND_HID 断言（否则整组罗技驱动会被静默丢弃）。
          BRAND_HID="CONFIG_LEDS_CLASS CONFIG_LEDS_CLASS_MULTICOLOR \
                     CONFIG_HID_LOGITECH CONFIG_HID_LOGITECH_DJ \
                     CONFIG_HID_MICROSOFT CONFIG_HID_A4TECH CONFIG_HID_CHERRY \
                     CONFIG_HID_REDRAGON CONFIG_HID_APPLE"
          BRAND_MISSING=""
          for k in $BRAND_HID; do
            v="$(grep -E "^${k}=(y|m)$" .config || true)"
            if [ -n "$v" ]; then
              echo "  [OK]   $v"
            else
              echo "  [FAIL] ${k} 未启用（当前：$(grep -E "^${k}=" .config || echo '缺失或为 n')）"
              BRAND_MISSING="$BRAND_MISSING $k"
            fi
          done
          if [ -n "$BRAND_MISSING" ]; then
            if [ "$ALLOW_DEGRADED" = "true" ]; then
              echo "::warning::容错模式已开启：品牌 HID 驱动未启用（y/m 均可）：$BRAND_MISSING" >&2
            else
              echo "::error::家用品牌 HID 驱动未启用（y/m 均可），罗技/微软等键鼠可能失灵：$BRAND_MISSING" >&2
              exit 1
            fi
          fi

          # ---- 压缩算法断言：必须 zstd ----
          # KERNEL_GZIP / KERNEL_ZSTD 是同一 choice 组的成员。若片段里的
          # "# CONFIG_KERNEL_GZIP is not set" 没生效，olddefconfig 会退回默认
          # 的 gzip，肉眼看不出、但启动解压就慢了。这里直接断言拦下。
          if grep -qE '^CONFIG_KERNEL_ZSTD=y$' .config; then
            echo "[OK] 内核压缩算法: CONFIG_KERNEL_ZSTD=y（解压最快）"
          else
            echo "::error::内核压缩算法未生效：期望 CONFIG_KERNEL_ZSTD=y，当前生效的是 $(grep -E '^CONFIG_KERNEL_(GZIP|ZSTD|XZ|LZ4|LZO|BZIP2|LZMA)=y$' .config | tr '\n' ' ')" >&2
            exit 1
          fi

          # 导出最终生效的配置供排查/发布
          # 注意：文件名必须用 ASCII（matrix.tag），中文会被 GitHub 发布时剔除，
          # 导致出现 config-.txt 这种残缺名
          cp -v .config "${{ github.workspace }}/config-${{ matrix.tag }}.txt"

      - name: 构建内核与模块
        working-directory: linux-${{ env.KERNEL_VERSION }}
        run: make -j$(nproc) bzImage modules

      - name: 将模块安装至暂存目录
        working-directory: linux-${{ env.KERNEL_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p ${{ github.workspace }}/modules-staging
          make INSTALL_MOD_PATH=${{ github.workspace }}/modules-staging modules_install

          # 诊断：统计 .ko 数量
          KO=$(find ${{ github.workspace }}/modules-staging -name '*.ko' | wc -l)
          echo ".ko 模块文件数: $KO"
          du -sh ${{ github.workspace }}/modules-staging
          if [ "$KO" -eq 0 ]; then
            if [ "${{ matrix.tag }}" = "rt-mod" ]; then
              echo "::error::本配置应为模块化内核，却未生成任何 .ko，配置可能没生效" >&2
              exit 1
            fi
            echo "提示：未生成 .ko（本内核为全内建，驱动已编入 bzImage），modules.tar.gz 只含元数据"
          fi

      - name: 打包内核模块
        run: |
          set -euo pipefail
          MODROOT="${{ github.workspace }}/modules-staging/lib/modules"
          [ -d "$MODROOT" ] || { echo "ERROR: 模块暂存目录不存在: $MODROOT" >&2; exit 1; }
          cd "$MODROOT"

          # 版本目录不用 "ls -d */ | head -1" 碰运气：
          # 目录按字母序排列时 "7.3.3-rt-mod" 会排在 "7.3.3-rt" 前面，
          # 一旦同名残留多个版本就会静默取错。这里逐个校验格式，只认唯一命中。
          KVER_DIR=""
          for d in */; do
            [ -d "$d" ] || continue
            name="${d%/}"
            case "$name" in
              [0-9]*.[0-9]*)
                if [ -n "$KVER_DIR" ]; then
                  echo "ERROR: 发现多个版本目录（$KVER_DIR 与 $name），无法判断该打包哪个" >&2
                  ls -la
                  exit 1
                fi
                KVER_DIR="$name"
                ;;
            esac
          done
          [ -n "$KVER_DIR" ] || { echo "ERROR: 未能识别版本目录" >&2; ls -la; exit 1; }
          echo "模块目录: $KVER_DIR"
          # build / source / vmlinux 等位于版本子目录内部
          sudo rm -f "$KVER_DIR/build" "$KVER_DIR/source" \
                       "$KVER_DIR/vmlinux" "$KVER_DIR/System.map"
          sudo find . \( -name "*.o" -o -name "*.cmd" -o -name ".tmp_*" \) -delete
          # 瘦身：去调试段、去 BTF。段不存在时 objcopy 仅告警、退出码仍为 0，
          # 这里再加 || true 只是防御，不影响构建。
          sudo find . -name "*.ko" -exec strip --strip-debug {} \; || true
          sudo find . -name "*.ko" -exec objcopy --remove-section .BTF {} \; || true

          # 与 rootfs 打包统一使用 numeric-owner；
          # .ko 不含 file capability，因此不需要 --xattrs/--acls。
          sudo tar --numeric-owner -zcf ../modules.tar.gz .

          ls -lh ../modules.tar.gz
          echo "包内 .ko 数量: $(tar tzf ../modules.tar.gz | grep -c '\.ko$' || true)"

          # 关键校验：包内顶层目录必须与 $KVER_DIR 一致，
          # 把 "目录名 ≠ uname -r" 这类错当场拦下，而不是等到装机后模块加载失败。
          PKG_KVER=$(tar tzf ../modules.tar.gz | sed 's|^\./||' | cut -d/ -f1 | grep -v '^$' | sort -u | head -1)
          echo "包内顶层目录: $PKG_KVER"
          if [ "$PKG_KVER" != "$KVER_DIR" ]; then
            echo "ERROR: 包内顶层目录（$PKG_KVER）与预期（$KVER_DIR）不一致" >&2
            exit 1
          fi
          echo "OK: 包结构与 uname -r 一致: $KVER_DIR"

      - name: 上传内核镜像
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # 资源上传失败时让构建直接报错，避免"没传上去却显示成功"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: kernel-image-${{ matrix.config_type }}
          body: |
            ====================🧊固件信息🧊=======================
            ➦ 💻 固件平台：x86-64-linux
            ➦ ⚽ 固件源码：https://cdn.kernel.org/
            ➦ 🚀 内核版本：${{ env.KERNEL_VERSION }}
            ➦ 📄 本包内含 bzImage 与最终生效的 .config（config-${{ matrix.tag }}.txt）
            ➦ 📦 模块策略：${{ matrix.mode }}
          artifacts: |
            linux-${{ env.KERNEL_VERSION }}/arch/x86/boot/bzImage
            ${{ github.workspace }}/config-${{ matrix.tag }}.txt

      - name: 上传内核模块
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # 资源上传失败时让构建直接报错，避免"没传上去却显示成功"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: kernel-modules-${{ matrix.config_type }}
          body: |
            ====================🧊固件信息🧊=======================
            ➦ 💻 固件平台：x86-64-linux
            ➦ ⚽ 固件源码：https://cdn.kernel.org/
            ➦ 🚀 内核版本：${{ env.KERNEL_VERSION }}
            ➦ 📦 模块策略：${{ matrix.mode }}
            ➦ 🛠 说明：全内建版本包仅含 modules.builtin 等元数据（约 90KB），属正常现象；
                       模块化版本包内含真实 .ko（十几~几十 MB），安装时必须解压到目标盘。
          artifacts: ${{ github.workspace }}/modules-staging/lib/modules.tar.gz
