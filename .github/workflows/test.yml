name: 测试7.4-rc1和6.12.115 config对比

on:
  workflow_dispatch: # 允许在 Actions 页面手动触发

env:
  KERNEL_VERSION: 7.4-rc1

jobs:
  build_kernel:
    name: ${{ matrix.config_type }} 编译
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- RT 全内建：所有驱动编进 bzImage，部署只需一个文件 ----
          - config_type: RT实时内核
            tag: rt
            fragment: https://github.com/rmoyulong/Template/releases/download/kernel-image-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8/config-rt.txt
            mode: 全内建（所有驱动编入 bzImage，modules 包只含元数据）
          # ---- RT 模块化：关键驱动内建，其余走模块 ----
          - config_type: RT实时内核-模块化
            tag: rt-mod
            fragment: https://github.com/rmoyulong/Template/releases/download/kernel-image-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8-%E6%A8%A1%E5%9D%97%E5%8C%96/config-rt-mod.txt
            mode: 关键驱动内建 + 其余模块化（需同时安装 modules.tar.gz）
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘约 14GB，编译内核（源码+产物）需 10GB 以上，
      # 两个矩阵任务并行更容易爆盘，先腾空间
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: 安装构建依赖项
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc xz-utils zstd cpio dwarves

      - name: 下载内核源码
        run: |
          #wget -q https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${{ env.KERNEL_VERSION }}.tar.xz
          wget -q https://git.kernel.org/torvalds/t/linux-${{ env.KERNEL_VERSION }}.tar.gz
          tar -xJf linux-${{ env.KERNEL_VERSION }}.tar.xz
          ls -d linux-${{ env.KERNEL_VERSION }}

      - name: 配置内核
        working-directory: linux-${{ env.KERNEL_VERSION }}
        run: |
          set -euo pipefail
		  wget ${{ matrix.fragment }} -O .config
		  
		  make listnewconfig
		  
		  make olddefconfig         # 新增项自动取默认值
		  scripts/diffconfig .config.old .config | less 
		  
		  KCONFIG_WARN_UNKNOWN_SYMBOLS=y make olddefconfig
		  
		  cp -v .config "${{ github.workspace }}/config-${{ matrix.tag }}.txt"
		  
      - name: 上传测试config
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # 资源上传失败时让构建直接报错，避免"没传上去却显示成功"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: test-${{ matrix.config_type }}
          body: |
            ====================🧊固件信息🧊=======================
            ➦ 💻 固件平台：x86-64-linux
            ➦ ⚽ 固件源码：https://cdn.kernel.org/
            ➦ 🚀 内核版本：${{ env.KERNEL_VERSION }}
            ➦ 📦 模块策略：${{ matrix.mode }}
          artifacts: |
            ${{ github.workspace }}/config-${{ matrix.tag }}.txt
