name: 编译音乐Linux（PREEMPT_RT）-7.3.x

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "构建 bzImage 和内核模块（false = 仅进行配置检查）"
        required: true
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-daphile-kernel.yml"
      - "kernel_config_migration_7.3.3/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ARCH: x86
      BUILD_JOBS: 2
      KERNEL_VERSION: "7.3.3"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖项
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git \
            libelf-dev libssl-dev pahole perl python3 rsync tar xz-utils

      - name: 配置 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-7.3.3-x86_64-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            linux-7.3.3-x86_64-${{ runner.os }}-

      - name: 下载 Linux 源码
        run: |
          curl -fL --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.tar.xz \
            -o linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz

      - name: 执行 Daphile 配置迁移
        run: |
          MIGRATION_DIR="$GITHUB_WORKSPACE/kernel_config_migration_7.3.3"
          test -f "$MIGRATION_DIR/apply_migration.sh"
          cd "linux-${KERNEL_VERSION}"
          bash "$MIGRATION_DIR/apply_migration.sh"

      - name: 验证最终内核配置
        run: |
          cd "linux-${KERNEL_VERSION}"
          test -f .config.daphile-7.3.3
          grep -qx 'CONFIG_X86_64=y' .config.daphile-7.3.3
          grep -qx 'CONFIG_PREEMPT_RT=y' .config.daphile-7.3.3
          cp .config.daphile-7.3.3 .config
          make ARCH=x86 olddefconfig
          grep -qx 'CONFIG_X86_64=y' .config
          grep -qx 'CONFIG_PREEMPT_RT=y' .config
          cp .config .config.daphile-7.3.3
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cp .config "$GITHUB_WORKSPACE/diagnostics/config"
          cp .config.daphile-7.3.3 "$GITHUB_WORKSPACE/diagnostics/config.daphile-7.3.3"
          for f in config_migration_check.txt config_diff_from_x86_64_defconfig.txt; do
            if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/diagnostics/"; fi
          done

      - name: 仅构建配置
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_modules == false }}
        run: |
          mkdir -p config-only
          cp "linux-${KERNEL_VERSION}/.config" config-only/config
          tar -czf config-only.tar.gz -C config-only config

      - name: 构建内核镜像及模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        run: |
          cd "linux-${KERNEL_VERSION}"
          export CC="ccache gcc"
          ccache -M 2G
          make ARCH=x86 -j"${BUILD_JOBS}" bzImage modules
          
      - name: 检查磁盘空间
        run: |
            echo "=== 磁盘空间 ==="
            df -h
            echo "=== Inode 使用情况 ==="
            df -i
            echo "=== 工作空间使用情况 ==="
            du -sh "$GITHUB_WORKSPACE"/* 2>/dev/null | sort -h

      - name: 清理构建文件
        run: |
          rm -rf "$HOME/.cache/ccache"
          df -h
    
      - name: 打包发布文件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        run: |
            set -euo pipefail
            
            MODULE_DIR="$GITHUB_WORKSPACE/package/rootfs/lib/modules/7.3.3"
            mkdir -p "$GITHUB_WORKSPACE/release-files"
            
            OUTPUT="$GITHUB_WORKSPACE/release-files/modules.tar.gz"            
            test -d "$MODULE_DIR"            
            tar -czf "$OUTPUT" -C "$MODULE_DIR" .            
            ls -lh "$OUTPUT"
          
            cp linux-7.3.3/arch/x86/boot/bzImage release-files/bzImage
            cp linux-7.3.3/.config release-files/config            

      - name: 创建发布并上传
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: music-linux-7.3.x
          name: "音乐Linux ${{ env.KERNEL_VERSION }} x86_64 PREEMPT_RT (build ${{ github.run_number }})"
          body: |
            音乐 Linux ${{ env.KERNEL_VERSION }} x86_64 PREEMPT_RT 构建版本.

            上传清单:
            - `bzImage`: Linux 内核映像
            - `config`: 最终内核配置
            - `modules.tar.gz`: 已安装的内核模块
            - 内核版本：${{ env.KERNEL_VERSION }}

            Source commit: `${{ github.sha }}`
          artifacts: "release-files/bzImage,release-files/config,release-files/modules.tar.gz"
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
