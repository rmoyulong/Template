name: 编译音乐Linux（PREEMPT_RT）-7.3.x

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "构建 bzImage 和内核模块（false = 仅进行配置检查）"
        required: true
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-daphile-kernel.yml"
      - "kernel_config_migration_7.3.3/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ARCH: x86
      BUILD_JOBS: 2
      KERNEL_VERSION: "7.3.3"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖项
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git \
            libelf-dev libssl-dev pahole perl python3 rsync tar xz-utils

      - name: 配置 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-7.3.3-x86_64-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            linux-7.3.3-x86_64-${{ runner.os }}-

      - name: 下载 Linux 源码
        run: |
          curl -fL --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.tar.xz \
            -o linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz

      - name: 执行 Daphile 配置迁移
        run: |
          MIGRATION_DIR="$GITHUB_WORKSPACE/kernel_config_migration_7.3.3"
          test -f "$MIGRATION_DIR/apply_migration.sh"
          cd "linux-${KERNEL_VERSION}"
          bash "$MIGRATION_DIR/apply_migration.sh"

      - name: 验证最终内核配置
        run: |
          cd "linux-${KERNEL_VERSION}"
          test -f .config.daphile-7.3.3
          grep -qx 'CONFIG_X86_64=y' .config.daphile-7.3.3
          grep -qx 'CONFIG_PREEMPT_RT=y' .config.daphile-7.3.3
          cp .config.daphile-7.3.3 .config
          make ARCH=x86 olddefconfig
          
          echo "===== 音频配置 ====="
          grep -E \
          '^(CONFIG_SOUND=|CONFIG_SND=|CONFIG_SND_PCM=|CONFIG_SND_ALOOP=|CONFIG_SND_HDA_INTEL=|CONFIG_SND_HDA_CORE=|CONFIG_SND_HDA_CODEC_REALTEK=|CONFIG_SND_HDA_CODEC_HDMI=|CONFIG_SND_USB_AUDIO=|CONFIG_KERNEL_ZSTD=)' \
          .config
          
          echo "===== 确认所需的音频选项 ====="
          for opt in \
            CONFIG_SOUND \
            CONFIG_SND \
            CONFIG_SND_PCM \
            CONFIG_SND_ALOOP \
            CONFIG_SND_HDA_INTEL \
            CONFIG_SND_HDA_CODEC_REALTEK \
            CONFIG_SND_HDA_CODEC_HDMI \
            CONFIG_SND_USB_AUDIO \
            CONFIG_KERNEL_ZSTD
          do
            grep -qx "${opt}=y" .config || {
              echo "错误：${opt} 未启用"
              exit 1
            }
          done

          grep -qx 'CONFIG_X86_64=y' .config
          grep -qx 'CONFIG_PREEMPT_RT=y' .config
          cp .config .config.daphile-7.3.3
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cp .config "$GITHUB_WORKSPACE/diagnostics/config"
          cp .config.daphile-7.3.3 "$GITHUB_WORKSPACE/diagnostics/config.daphile-7.3.3"
          for f in config_migration_check.txt config_diff_from_x86_64_defconfig.txt; do
            if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/diagnostics/"; fi
          done

      - name: 仅构建配置
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_modules == false }}
        run: |
          mkdir -p config-only
          cp "linux-${KERNEL_VERSION}/.config" config-only/config
          tar -czf config-only.tar.gz -C config-only config

      - name: 构建内核镜像及模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        run: |
          cd "linux-${KERNEL_VERSION}"
          export CC="ccache gcc"
          ccache -M 2G
          make ARCH=x86 -j"${BUILD_JOBS}" bzImage modules
          
      # 安装编译好的内核模块到暂存目录
      - name: 安装内核模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/linux-${KERNEL_VERSION}"
          MODULES_STAGING="$GITHUB_WORKSPACE/modules-staging"

          KERNEL_RELEASE=$(make -s -C "$KERNEL_DIR" ARCH=x86 kernelrelease)

          echo "Kernel release: $KERNEL_RELEASE"
          echo "Modules staging: $MODULES_STAGING"

          make -C "$KERNEL_DIR" \
            ARCH=x86 \
            INSTALL_MOD_PATH="$MODULES_STAGING" \
            modules_install

          # 供后续步骤使用
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"
          echo "MODULES_STAGING=$MODULES_STAGING" >> "$GITHUB_ENV"

          echo "=== Installed modules ==="
          ls -lah "$MODULES_STAGING/lib/modules/$KERNEL_RELEASE"

      # 打包内核模块
      - name: 打包内核模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MODULE_DIR="$MODULES_STAGING/lib/modules/$KERNEL_RELEASE"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-files"

          mkdir -p "$RELEASE_DIR"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "::error::Module directory not found: $MODULE_DIR"
            exit 1
          fi

          echo "=== Module directory ==="
          du -sh "$MODULE_DIR"

          echo "=== Disk space ==="
          df -h "$GITHUB_WORKSPACE"

          # 保留 7.3.3 目录层级
          tar -czf "$RELEASE_DIR/modules.tar.gz" \
            -C "$MODULES_STAGING/lib/modules" \
            "$KERNEL_RELEASE"

          echo "=== Package result ==="
          ls -lh "$RELEASE_DIR/modules.tar.gz"

      # 准备 Release 文件
      - name: 准备发布文件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/linux-${KERNEL_VERSION}"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-files"

          mkdir -p "$RELEASE_DIR"

          test -f "$KERNEL_DIR/arch/x86/boot/bzImage"
          test -f "$KERNEL_DIR/.config"

          cp "$KERNEL_DIR/arch/x86/boot/bzImage" \
             "$RELEASE_DIR/bzImage"

          cp "$KERNEL_DIR/.config" \
             "$RELEASE_DIR/config"

          echo "=== Release files ==="
          ls -lh "$RELEASE_DIR"

      # 检查发布文件
      - name: 检查发布文件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/release-files"

          test -s bzImage
          test -s config
          test -s modules.tar.gz

          echo "=== SHA256 ==="
          sha256sum bzImage config modules.tar.gz
          
      # 创建 GitHub Release
      - name: 创建发布并上传
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: music-linux-7.3.x
          name: music-linux-${{ env.KERNEL_VERSION }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "release-files/bzImage,release-files/config,release-files/modules.tar.gz"
          body: | 
            音乐 Linux ${{ env.KERNEL_VERSION }} x86_64 PREEMPT_RT 构建版本.
            上传清单:
            - `bzImage`: Linux 内核映像
            - `config`: 最终内核配置
            - `modules.tar.gz`: 已安装的内核模块
            - 内核版本：${{ env.KERNEL_VERSION }} 