name: Build Daphile 6.12.30 reconstruction

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DAPHILE_DIR: 6.12.30-daphile

jobs:
  build:
    name: 6.12.30 PREEMPT_RT reconstruction
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc xz-utils zstd cpio dwarves kmod perl

      - name: Download exact Linux 6.12.30 source
        run: |
          set -euo pipefail
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.30.tar.xz
          tar -xJf linux-6.12.30.tar.xz

      - name: Reconstruct config from official module inventory
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/$DAPHILE_DIR/daphile-6.12.30-official-modules.lsmod"
          test -f "$GITHUB_WORKSPACE/$DAPHILE_DIR/daphile-6.12.30-official-builtin.lsmod"
          bash "$GITHUB_WORKSPACE/$DAPHILE_DIR/reconstruct-daphile-6.12.30-config.sh"
          cp .config "$GITHUB_WORKSPACE/config-6.12.30-daphile-rebuild.txt"

          require() {
            local symbol="$1" value="$2"
            grep -qx "${symbol}=${value}" .config || {
              echo "::error::${symbol} expected ${value}, got $(grep -E "^${symbol}=" .config || echo unset)"
              exit 1
            }
          }
          require CONFIG_PREEMPT_RT y
          require CONFIG_SMP y
          require CONFIG_MODULES y
          require CONFIG_MODULE_UNLOAD y
          require CONFIG_SOUND y
          require CONFIG_SND y
          require CONFIG_SND_PCM y
          require CONFIG_SND_TIMER y
          require CONFIG_SND_HRTIMER y
          require CONFIG_SND_ALOOP y
          require CONFIG_SND_HDA_INTEL m
          require CONFIG_SND_HDA_GENERIC m
          require CONFIG_SND_HDA_CODEC_REALTEK m
          require CONFIG_SND_HDA_CODEC_HDMI m
          require CONFIG_SND_HDA_CORE m
          require CONFIG_SND_INTEL_DSP_CONFIG m

      - name: Build kernel and modules
        working-directory: linux-6.12.30
        run: make -j"$(nproc)" bzImage modules

      - name: Install modules to staging directory
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail
          make INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-staging" modules_install
          test -d "$GITHUB_WORKSPACE/modules-staging/lib/modules/6.12.30-daphile-rebuild"

      - name: Compare generated inventory with official package
        run: |
          set -euo pipefail
          MODDIR="$GITHUB_WORKSPACE/modules-staging/lib/modules/6.12.30-daphile-rebuild"
          find "$MODDIR" -type f -name '*.ko' -printf '%f\n' \
            | sed 's/\.ko$//' | tr '-' '_' | sort -u \
            > "$GITHUB_WORKSPACE/built-modules.names"
          tail -n +2 "$GITHUB_WORKSPACE/$DAPHILE_DIR/daphile-6.12.30-official-modules.lsmod" \
            | awk '{print $1}' | sort -u \
            > "$GITHUB_WORKSPACE/official-modules.names"
          comm -23 "$GITHUB_WORKSPACE/official-modules.names" "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-missing-from-build.txt"
          comm -13 "$GITHUB_WORKSPACE/official-modules.names" "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-extra-in-build.txt"

          sort -u "$MODDIR/modules.builtin" > "$GITHUB_WORKSPACE/built-builtin.paths"
          sort -u "$GITHUB_WORKSPACE/$DAPHILE_DIR/daphile-6.12.30-official-builtin.paths" \
            > "$GITHUB_WORKSPACE/official-builtin.paths.sorted"
          comm -23 "$GITHUB_WORKSPACE/official-builtin.paths.sorted" "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"
          comm -13 "$GITHUB_WORKSPACE/official-builtin.paths.sorted" "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-extra-in-build.txt"

          {
            echo "Official module count: $(wc -l < "$GITHUB_WORKSPACE/official-modules.names")"
            echo "Built module count:    $(wc -l < "$GITHUB_WORKSPACE/built-modules.names")"
            echo "Missing module names:  $(wc -l < "$GITHUB_WORKSPACE/modules-missing-from-build.txt")"
            echo "Extra module names:    $(wc -l < "$GITHUB_WORKSPACE/modules-extra-in-build.txt")"
            echo "Official builtin count: $(wc -l < "$GITHUB_WORKSPACE/official-builtin.paths.sorted")"
            echo "Built builtin count:    $(wc -l < "$GITHUB_WORKSPACE/built-builtin.paths")"
            echo "Missing builtin paths:  $(wc -l < "$GITHUB_WORKSPACE/builtin-missing-from-build.txt")"
            echo "Extra builtin paths:    $(wc -l < "$GITHUB_WORKSPACE/builtin-extra-in-build.txt")"
          } | tee "$GITHUB_WORKSPACE/inventory-comparison.txt"

      - name: Package modules
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/modules-staging/lib/modules"
          tar --numeric-owner -czf "$GITHUB_WORKSPACE/modules-6.12.30-daphile-rebuild.tar.gz" 6.12.30-daphile-rebuild
          ls -lh "$GITHUB_WORKSPACE/modules-6.12.30-daphile-rebuild.tar.gz"

      - name: Publish build artifacts
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: kernel-6.12.30-daphile-rebuild
          name: Daphile 6.12.30 PREEMPT_RT reconstruction
          body: |
            Reconstructed from the official Daphile 6.12.30 kernel image and module inventory.
            This is a test kernel; keep the original 6.12.30-daphile kernel as fallback.
            Review config and inventory comparison before installation.
          artifacts: |
            ${{ github.workspace }}/linux-6.12.30/arch/x86/boot/bzImage
            ${{ github.workspace }}/config-6.12.30-daphile-rebuild.txt
            ${{ github.workspace }}/modules-6.12.30-daphile-rebuild.tar.gz
            ${{ github.workspace }}/inventory-comparison.txt
            ${{ github.workspace }}/modules-missing-from-build.txt
            ${{ github.workspace }}/modules-extra-in-build.txt
            ${{ github.workspace }}/builtin-missing-from-build.txt
            ${{ github.workspace }}/builtin-extra-in-build.txt
