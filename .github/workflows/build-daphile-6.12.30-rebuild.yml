
name: Build Daphile 6.12.30 PREEMPT_RT Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daphile-6.12.30-rebuild
  cancel-in-progress: false

env:
  DAPHILE_DIR: 6.12.30-daphile
  KERNEL_VERSION: 6.12.30
  KERNEL_SUFFIX: -daphile-rebuild
  KERNEL_RELEASE: 6.12.30-daphile-rebuild
  BUILD_JOBS: 3

jobs:
  build:
    name: Reconstruct and build Linux 6.12.30
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Free disk space
      # --------------------------------------------------

      - name: Free runner disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL || true

          sudo apt-get clean
          df -h

      - name: 切换 Ubuntu APT 镜像源
        run: |
          set -euo pipefail
          
            echo "===== ORIGINAL APT SOURCES ====="
            cat /etc/apt/sources.list.d/ubuntu.sources
            # 绕过 GitHub Runner 默认的 Azure mirror list
            sudo sed -i -E \
              's|mirror\+file:/etc/apt/apt-mirrors\.txt|https://mirrors.aliyun.com/ubuntu/|g; s|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://mirrors.aliyun.com/ubuntu/|g' \
              /etc/apt/sources.list.d/ubuntu.sources
            echo "===== UPDATED APT SOURCES ====="
            cat /etc/apt/sources.list.d/ubuntu.sources
    
      - name: 安装构建依赖项
        run: |
          set -euo pipefail
          
            echo "===== 带重试机制的 APT 更新 ====="
            for attempt in 1 2 3 4 5; do
              echo "尝试执行 APT 更新: $attempt"
              
              if sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update; then
                break
              fi
              
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::APT 更新在尝试 5 次后失败"
                exit 1
              fi
              
              sleep 20
            done
            
            echo "===== 安装构建依赖项S ====="
            sudo apt-get install -y \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              build-essential \
              libncurses-dev \
              bison \
              flex \
              libssl-dev \
              libelf-dev \
              bc \
              xz-utils \
              zstd \
              cpio \
              dwarves \
              kmod \
              perl \
              python3 \
              rsync \
              wget \
              git \
              ccache

      - name: 配置 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-dephile-x86_64-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            linux-dephile-x86_64-${{ runner.os }}-


      # --------------------------------------------------
      # 4. Download exact Linux 6.12.30
      # --------------------------------------------------

      - name: Download Linux 6.12.30 source
        run: |
          set -euo pipefail

          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.30.tar.xz
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc
          grep 'linux-6.12.30.tar.xz

          test -f linux-6.12.30/Makefile

          cd linux-6.12.30

          VERSION="$(make -s kernelversion)"

          echo "Kernel source version: $VERSION"

          if [[ "$VERSION" != "$KERNEL_VERSION" ]]; then
            echo "::error::Unexpected kernel source version: $VERSION"
            exit 1
          fi

      # --------------------------------------------------
      # 5. Reconstruct configuration
      # --------------------------------------------------

      - name: Reconstruct and verify the audited configuration
        shell: bash
        working-directory: linux-6.12.30
        env:
          EXPECTED_CONFIG_SHA256: 8525198ef7700e8a843551d98a582f408a138933fcb25216a212e5865ed980df
        run: |
          set -Eeuo pipefail

          echo "===== RUN THE SAME CONFIG RECONSTRUCTION SCRIPT AS THE AUDIT WORKFLOW ====="
          AUDIT_OUT="$GITHUB_WORKSPACE/config-audit" \
            bash "../${DAPHILE_DIR}/reconstruct-daphile-6.12.30-config.sh"

          CANDIDATE="$GITHUB_WORKSPACE/config-audit/config.candidate"
          REPORT="$GITHUB_WORKSPACE/config-audit/audit-report.txt"
          test -s "$CANDIDATE"
          test -s "$REPORT"

          echo
          echo "===== VERIFY AUDITED CONFIG SHA256 ====="
          ACTUAL_CONFIG_SHA256="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          echo "Expected: $EXPECTED_CONFIG_SHA256"
          echo "Actual:   $ACTUAL_CONFIG_SHA256"
          if [[ "$ACTUAL_CONFIG_SHA256" != "$EXPECTED_CONFIG_SHA256" ]]; then
            echo "::error::Reconstructed config differs from the reviewed audit candidate"
            exit 1
          fi

          # The kernel build must consume the exact, reviewed candidate.
          cp "$CANDIDATE" .config
          test "$(sha256sum .config | awk '{print $1}')" = "$EXPECTED_CONFIG_SHA256"

          echo
          echo "===== SYNCHRONIZE KCONFIG DERIVED FILES ====="
          make syncconfig

          # syncconfig must not silently change the reviewed .config.
          FINAL_CONFIG_SHA256="$(sha256sum .config | awk '{print $1}')"
          echo "Config SHA256 after syncconfig: $FINAL_CONFIG_SHA256"
          if [[ "$FINAL_CONFIG_SHA256" != "$EXPECTED_CONFIG_SHA256" ]]; then
            echo "::error::make syncconfig changed the reviewed .config"
            exit 1
          fi

          KREL="$(make -s kernelrelease)"
          echo "Kernel release: $KREL"
          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          require_config() {
            local symbol="$1"
            local expected="$2"
            local actual
            actual="$(grep -E "^$symbol=" .config || true)"
            if [[ "$actual" != "$symbol=$expected" ]]; then
              echo "::error::Configuration mismatch: $symbol"
              echo "Expected: $symbol=$expected"
              echo "Actual:   ${actual:-not set}"
              exit 1
            fi
          }

          # Required project and audio settings.
          require_config CONFIG_PREEMPT_RT y
          require_config CONFIG_HIGH_RES_TIMERS y
          require_config CONFIG_HZ_250 y
          require_config CONFIG_HZ 250
          require_config CONFIG_KERNEL_ZSTD y
          require_config CONFIG_LOCALVERSION '"-daphile-rebuild"'
          require_config CONFIG_SOUND y
          require_config CONFIG_SND y
          require_config CONFIG_SND_PCM y
          require_config CONFIG_SND_TIMER y
          require_config CONFIG_SND_HRTIMER y
          require_config CONFIG_SND_ALOOP y
          require_config CONFIG_SND_PCI y
          require_config CONFIG_SND_HDA m
          require_config CONFIG_SND_HDA_CORE m
          require_config CONFIG_SND_HDA_INTEL m
          require_config CONFIG_SND_HDA_GENERIC m
          require_config CONFIG_SND_HDA_CODEC_REALTEK m
          require_config CONFIG_SND_HDA_CODEC_HDMI m
          require_config CONFIG_SND_INTEL_DSP_CONFIG m

          # Startup-critical storage/filesystem path must remain built-in.
          require_config CONFIG_EFI y
          require_config CONFIG_EFI_STUB y
          require_config CONFIG_EFI_PARTITION y
          require_config CONFIG_PCI y
          require_config CONFIG_DEVTMPFS y
          require_config CONFIG_DEVTMPFS_MOUNT y
          require_config CONFIG_ATA y
          require_config CONFIG_SATA_AHCI y
          require_config CONFIG_SCSI y
          require_config CONFIG_BLK_DEV_SD y
          require_config CONFIG_EXT4_FS y
          require_config CONFIG_JBD2 y
          require_config CONFIG_BLK_DEV_INITRD y
          require_config CONFIG_RD_ZSTD y

          # Newly audited inventory-backed dependencies.
          require_config CONFIG_FSCACHE y
          require_config CONFIG_CACHEFILES y
          require_config CONFIG_NFS_V3_ACL y
          require_config CONFIG_NFS_ACL_SUPPORT y
          require_config CONFIG_NFS_V4_1 y
          require_config CONFIG_PNFS_BLOCK y
          require_config CONFIG_PNFS_FILE_LAYOUT y
          require_config CONFIG_PNFS_FLEXFILE_LAYOUT y

          cp .config .config.daphile-6.12.30-reconstructed
          cp "$REPORT" "$GITHUB_WORKSPACE/config-audit-report.txt"
          cp "$CANDIDATE" "$GITHUB_WORKSPACE/config-audited-candidate"

          echo
          echo "===== CONFIGURATION LOCKED FOR BUILD ====="
          echo "Kernel release: $KREL"
          echo "Candidate SHA256: $FINAL_CONFIG_SHA256"
          echo "Audit report: $GITHUB_WORKSPACE/config-audit-report.txt"
          echo "No independent localmodconfig reconstruction is performed in this build workflow."

      # --------------------------------------------------
      # 6. Build kernel
      # --------------------------------------------------

      - name: Build bzImage and modules
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail
          export CC="ccache gcc"
          ccache -M 3G

          export ARCH=x86

          echo "=================================="
          echo "Building Linux 6.12.30"
          echo "=================================="

          # Use CONFIG_LOCALVERSION from .config.
          # Never append KERNEL_SUFFIX again.

          KREL="$(make -s kernelrelease)"

          echo "Expected: $KERNEL_RELEASE"
          echo "Actual:   $KREL"

          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          make -j"${BUILD_JOBS}" bzImage modules

          test -s arch/x86/boot/bzImage

          echo "Built kernel release: $KREL"

          ls -lh arch/x86/boot/bzImage

      # --------------------------------------------------
      # 7. Install modules
      # --------------------------------------------------

      - name: Install kernel modules and verify depmod
        working-directory: linux-6.12.30
        shell: bash
        run: |
          set -Eeuo pipefail

          KREL="$(make -s kernelrelease)"
          STAGE="$GITHUB_WORKSPACE/modules-staging"
          MODDIR="$STAGE/lib/modules/$KREL"

          echo "===== KERNEL RELEASE CHECK ====="
          echo "Expected: $KERNEL_RELEASE"
          echo "Actual:   $KREL"
          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          echo
          echo "===== DISK SPACE BEFORE INSTALL ====="
          df -h "$GITHUB_WORKSPACE"
          df -i "$GITHUB_WORKSPACE"

          # Start from a clean staging directory. This prevents stale module
          # files or metadata from a previous attempt from hiding install errors.
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          echo
          echo "===== RUN MODULES_INSTALL (ONCE) ====="
          make INSTALL_MOD_PATH="$STAGE" modules_install

          if [[ ! -d "$MODDIR" ]]; then
            echo "::error::Module directory missing: $MODDIR"
            find "$STAGE" -maxdepth 5 -type d -print || true
            exit 1
          fi

          # Remove build-time links; they must not point back into the runner.
          rm -f "$MODDIR/build" "$MODDIR/source"

          echo
          echo "===== INSTALLED MODULE COUNTS ====="
          KO_COUNT=$(find "$MODDIR" -type f -name '*.ko' | wc -l)
          GZ_COUNT=$(find "$MODDIR" -type f -name '*.ko.gz' | wc -l)
          XZ_COUNT=$(find "$MODDIR" -type f -name '*.ko.xz' | wc -l)
          ZST_COUNT=$(find "$MODDIR" -type f -name '*.ko.zst' | wc -l)
          TOTAL_MODULES=$((KO_COUNT + GZ_COUNT + XZ_COUNT + ZST_COUNT))
          printf 'Uncompressed .ko: %s\n' "$KO_COUNT"
          printf 'Gzip .ko.gz:      %s\n' "$GZ_COUNT"
          printf 'XZ .ko.xz:        %s\n' "$XZ_COUNT"
          printf 'ZSTD .ko.zst:     %s\n' "$ZST_COUNT"
          printf 'Total modules:    %s\n' "$TOTAL_MODULES"

          if [[ "$TOTAL_MODULES" -eq 0 ]]; then
            echo "::error::No kernel module files were installed"
            find "$MODDIR" -maxdepth 4 -type f -print | head -100 || true
            exit 1
          fi
          
          echo "===== MODULE FILE SAMPLES ====="
          find "$MODDIR/kernel" -type f \
            \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.xz' -o -name '*.ko.zst' \) \
            -print > "$GITHUB_WORKSPACE/module-file-list.txt"
          sed -n '1,30p' "$GITHUB_WORKSPACE/module-file-list.txt"

          echo
          echo "===== DEPmod VERSION ====="
          depmod --version

          # Ubuntu's kmod may be built without ZLIB support (-ZLIB).
          # In that case depmod silently ignores .ko.gz files and can
          # produce an empty modules.dep even though modules_install worked.
          # Decompress only gzip-compressed modules before running depmod.
          # Uncompressed .ko files are supported by all kmod builds.
          echo
          echo "===== NORMALIZE GZIP MODULES FOR DEPmod ====="
          if depmod --version 2>&1 | grep -q -- '-ZLIB'; then
            echo "kmod has no ZLIB support; decompressing staged .ko.gz modules"
          else
            echo "Proceeding with gzip module normalization for maximum compatibility"
          fi

          GZIP_BEFORE=$(find "$MODDIR/kernel" -type f -name '*.ko.gz' | wc -l)
          echo "Gzip modules before normalization: $GZIP_BEFORE"

          if [[ "$GZIP_BEFORE" -gt 0 ]]; then
            while IFS= read -r -d '' MODULE; do
              gzip -t "$MODULE"
              gzip -d "$MODULE"
            done < <(find "$MODDIR/kernel" -type f -name '*.ko.gz' -print0)
          fi

          GZIP_AFTER=$(find "$MODDIR/kernel" -type f -name '*.ko.gz' | wc -l)
          KO_AFTER=$(find "$MODDIR/kernel" -type f -name '*.ko' | wc -l)
          echo "Gzip modules after normalization: $GZIP_AFTER"
          echo "Uncompressed .ko modules now:     $KO_AFTER"

          if [[ "$GZIP_AFTER" -ne 0 ]]; then
            echo "::error::Some .ko.gz modules could not be normalized"
            exit 1
          fi

          echo
          echo "===== METADATA BEFORE DEPmod ====="
          for FILE in modules.dep modules.builtin modules.order; do
            if [[ -f "$MODDIR/$FILE" ]]; then
              ls -lh "$MODDIR/$FILE"
            else
              echo "MISSING: $FILE"
            fi
          done

          # Always regenerate metadata explicitly after modules_install.
          # Capture verbose diagnostics so an empty modules.dep can be explained.
          echo
          echo "===== RUN VERBOSE DEPmod ====="
          set +e
          depmod -a -v -b "$STAGE" "$KREL" 2>&1 \
            | tee "$GITHUB_WORKSPACE/depmod-debug.log"
          DEPMOD_RC=${PIPESTATUS[0]}
          set -e
          echo "depmod exit code: $DEPMOD_RC"

          echo
          echo "===== DEPmod DRY-RUN OUTPUT ====="
          set +e
          depmod -n -v -b "$STAGE" "$KREL" \
            > "$GITHUB_WORKSPACE/depmod-dry-run.txt" 2>&1
          DRY_RC=$?
          set -e
          echo "depmod dry-run exit code: $DRY_RC"
          head -100 "$GITHUB_WORKSPACE/depmod-dry-run.txt" || true

          echo
          echo "===== MODULES.DEP AFTER DEPmod ====="
          if [[ -f "$MODDIR/modules.dep" ]]; then
            ls -lh "$MODDIR/modules.dep"
            wc -l "$MODDIR/modules.dep"
            head -30 "$MODDIR/modules.dep" || true
          else
            echo "modules.dep was not created"
          fi

          echo
          echo "===== FINAL DEPmod VALIDATION ====="
          if [[ "$DEPMOD_RC" -ne 0 ]]; then
            echo "::error::depmod failed with exit code $DEPMOD_RC"
            exit "$DEPMOD_RC"
          fi

          if [[ ! -s "$MODDIR/modules.dep" ]]; then
            echo "::error::modules.dep is empty after depmod"
            echo "Check depmod-debug.log and depmod-dry-run.txt in the workflow workspace."
            echo "Installed module count: $TOTAL_MODULES"
            exit 1
          fi

          if [[ ! -s "$MODDIR/modules.builtin" ]]; then
            echo "::error::modules.builtin missing or empty"
            exit 1
          fi

          echo "modules.dep and modules.builtin verified"
          echo
          echo "===== MODULE INSTALLATION SUCCESSFUL ====="
          du -sh "$MODDIR"
          ls -lh "$MODDIR"/modules.*
          echo
          echo "===== DISK SPACE AFTER INSTALL ====="
          df -h "$GITHUB_WORKSPACE"

      # --------------------------------------------------
      # 8. Compare official inventory
      # --------------------------------------------------

      - name: Compare official module and builtin inventory
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/$DAPHILE_DIR"

          KREL="$KERNEL_RELEASE"

          MODDIR="$GITHUB_WORKSPACE/modules-staging/lib/modules/$KREL"

          test -d "$MODDIR"

          # Official module names.

          tail -n +2 \
            "$ROOT/daphile-6.12.30-official-modules.lsmod" \
            | awk '{print $1}' \
            | sort -u \
            > "$GITHUB_WORKSPACE/official-modules.names"

          # Built module names.

          find "$MODDIR" -type f \
            \( -name '*.ko' -o -name '*.ko.xz' \
               -o -name '*.ko.zst' -o -name '*.ko.gz' \) \
            -printf '%f\n' \
            | sed -E 's/\.ko(\.(xz|zst|gz))?$//' \
            | tr '-' '_' \
            | sort -u \
            > "$GITHUB_WORKSPACE/built-modules.names"

          # Compare module names.

          comm -23 \
            "$GITHUB_WORKSPACE/official-modules.names" \
            "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-missing-from-build.txt"

          comm -13 \
            "$GITHUB_WORKSPACE/official-modules.names" \
            "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-extra-in-build.txt"

          # Official built-in object paths.

          sort -u "$ROOT/daphile-6.12.30-official-builtin.paths" \
            > "$GITHUB_WORKSPACE/official-builtin.paths.sorted"

          # Newly generated built-in object paths.

          sort -u "$MODDIR/modules.builtin" \
            > "$GITHUB_WORKSPACE/built-builtin.paths"

          comm -23 \
            "$GITHUB_WORKSPACE/official-builtin.paths.sorted" \
            "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"

          comm -13 \
            "$GITHUB_WORKSPACE/official-builtin.paths.sorted" \
            "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-extra-in-build.txt"

          # Generate comparison report.

          {
            echo "Daphile 6.12.30 inventory comparison"
            echo "===================================="
            echo
            echo "Kernel release: $KREL"
            echo
            echo "Official modules: $(wc -l < "$GITHUB_WORKSPACE/official-modules.names")"
            echo "Built modules: $(wc -l < "$GITHUB_WORKSPACE/built-modules.names")"
            echo "Missing modules: $(wc -l < "$GITHUB_WORKSPACE/modules-missing-from-build.txt")"
            echo "Extra modules: $(wc -l < "$GITHUB_WORKSPACE/modules-extra-in-build.txt")"
            echo
            echo "Official builtins: $(wc -l < "$GITHUB_WORKSPACE/official-builtin.paths.sorted")"
            echo "Built builtins: $(wc -l < "$GITHUB_WORKSPACE/built-builtin.paths")"
            echo "Missing builtins: $(wc -l < "$GITHUB_WORKSPACE/builtin-missing-from-build.txt")"
            echo "Extra builtins: $(wc -l < "$GITHUB_WORKSPACE/builtin-extra-in-build.txt")"
          } | tee "$GITHUB_WORKSPACE/inventory-comparison.txt"

          echo
          echo "Missing module examples:"
          head -n 30 "$GITHUB_WORKSPACE/modules-missing-from-build.txt"

          echo
          echo "Missing builtin examples:"
          head -n 30 "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"

      # --------------------------------------------------
      # 9. Package modules
      # --------------------------------------------------

      - name: Package modules.tar.gz
        run: |
          set -euo pipefail

          KREL="$KERNEL_RELEASE"

          STAGE="$GITHUB_WORKSPACE/modules-staging"

          MODDIR="$STAGE/lib/modules/$KREL"

          test -d "$MODDIR"
          test -s "$MODDIR/modules.dep"
          test -s "$MODDIR/modules.builtin"

          cd "$STAGE/lib/modules"

          tar \
            --numeric-owner \
            -czf "$GITHUB_WORKSPACE/modules.tar.gz" \
            "$KREL"

          test -s "$GITHUB_WORKSPACE/modules.tar.gz"

          echo "Module archive:"
          ls -lh "$GITHUB_WORKSPACE/modules.tar.gz"

          echo
          echo "Archive verification:"

          tar -tzf "$GITHUB_WORKSPACE/modules.tar.gz" > "$GITHUB_WORKSPACE/modules-archive-list.txt"
          sed -n '1,20p' "$GITHUB_WORKSPACE/modules-archive-list.txt"

      # --------------------------------------------------
      # 10. Prepare final artifacts
      # --------------------------------------------------

      - name: Prepare release artifacts
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail

          # Kernel image.

          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/bzImage"

          # Final configuration.

          cp .config "$GITHUB_WORKSPACE/config"

          # Verify artifacts.

          test -s "$GITHUB_WORKSPACE/bzImage"
          test -s "$GITHUB_WORKSPACE/config"
          test -s "$GITHUB_WORKSPACE/modules.tar.gz"
          test -f "$GITHUB_WORKSPACE/depmod-debug.log"
          test -f "$GITHUB_WORKSPACE/depmod-dry-run.txt"
          test -s "$GITHUB_WORKSPACE/inventory-comparison.txt"
          
          # Verify final configuration.

          grep -q '^CONFIG_KERNEL_ZSTD=y$' "$GITHUB_WORKSPACE/config"

          grep -q '^CONFIG_PREEMPT_RT=y$' "$GITHUB_WORKSPACE/config"
          grep -q '^CONFIG_HZ_250=y$' "$GITHUB_WORKSPACE/config"
          grep -q '^CONFIG_HZ=250$' "$GITHUB_WORKSPACE/config"

          if grep -qE '^CONFIG_MODULE_SIG_(ALL|FORCE)=y$|^CONFIG_IMA_APPRAISE_MODSIG=y$' "$GITHUB_WORKSPACE/config"; then
            echo "::error::Module-signature option unexpectedly enabled in exported config:"
            grep -E '^CONFIG_MODULE_SIG_(ALL|FORCE)=y$|^CONFIG_IMA_APPRAISE_MODSIG=y$' "$GITHUB_WORKSPACE/config" || true
            exit 1
          fi

          grep -q '^CONFIG_SYSTEM_TRUSTED_KEYS=""$' "$GITHUB_WORKSPACE/config"
          grep -q '^CONFIG_SYSTEM_REVOCATION_KEYS=""$' "$GITHUB_WORKSPACE/config"

          grep -q '^CONFIG_LOCALVERSION="-daphile-rebuild"$' "$GITHUB_WORKSPACE/config"

          # Generate SHA256 checksums.

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            bzImage \
            config \
            modules.tar.gz \
            depmod-debug.log \
            depmod-dry-run.txt \
            inventory-comparison.txt \
            > SHA256SUMS.txt

          echo "=================================="
          echo "Release artifacts"
          echo "=================================="

          ls -lh \
            bzImage \
            config \
            modules.tar.gz \
            depmod-debug.log \
            depmod-dry-run.txt \
            inventory-comparison.txt \
            SHA256SUMS.txt

          echo
          echo "Final kernel compression:"
          grep '^CONFIG_KERNEL_ZSTD=y$' config

          echo
          echo "Final kernel version:"
          grep '^CONFIG_LOCALVERSION=' config

          echo
          echo "SHA256:"
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 11. Publish GitHub Release
      # --------------------------------------------------

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          tag: kernel-6.12.30-daphile-rebuild

          name: Daphile 6.12.30 PREEMPT_RT Rebuild

          commit: master

          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: false

          body: |
            Daphile Linux 6.12.30 PREEMPT_RT reconstructed kernel.

            Architecture: x86_64
            Kernel: Linux 6.12.30
            Kernel release: 6.12.30-daphile-rebuild

            PREEMPT_RT: enabled
            Kernel compression: ZSTD
            Local version: -daphile-rebuild

            Configuration reconstructed using:
            - Official Daphile module inventory
            - Official modules.builtin inventory
            - Evidence-backed Kconfig fragment

            Important:
            This is a reconstructed configuration, not the original
            byte-for-byte Daphile configuration.

            Keep the original 6.12.30-daphile kernel as fallback.

          artifacts: |
            bzImage
            config
            modules.tar.gz
            depmod-debug.log
            depmod-dry-run.txt
            inventory-comparison.txt
            modules-missing-from-build.txt
            modules-extra-in-build.txt
            builtin-missing-from-build.txt
            builtin-extra-in-build.txt
            SHA256SUMS.txt
 sha256sums.asc | sha256sum -c -

          tar -xJf linux-6.12.30.tar.xz

          test -f linux-6.12.30/Makefile

          cd linux-6.12.30

          VERSION="$(make -s kernelversion)"

          echo "Kernel source version: $VERSION"

          if [[ "$VERSION" != "$KERNEL_VERSION" ]]; then
            echo "::error::Unexpected kernel source version: $VERSION"
            exit 1
          fi

      # --------------------------------------------------
      # 5. Reconstruct configuration
      # --------------------------------------------------

      - name: Reconstruct and verify the audited configuration
        shell: bash
        working-directory: linux-6.12.30
        env:
          EXPECTED_CONFIG_SHA256: 8525198ef7700e8a843551d98a582f408a138933fcb25216a212e5865ed980df
        run: |
          set -Eeuo pipefail

          echo "===== RUN THE SAME CONFIG RECONSTRUCTION SCRIPT AS THE AUDIT WORKFLOW ====="
          AUDIT_OUT="$GITHUB_WORKSPACE/config-audit" \
            bash "../${DAPHILE_DIR}/reconstruct-daphile-6.12.30-config.sh"

          CANDIDATE="$GITHUB_WORKSPACE/config-audit/config.candidate"
          REPORT="$GITHUB_WORKSPACE/config-audit/audit-report.txt"
          test -s "$CANDIDATE"
          test -s "$REPORT"

          echo
          echo "===== VERIFY AUDITED CONFIG SHA256 ====="
          ACTUAL_CONFIG_SHA256="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          echo "Expected: $EXPECTED_CONFIG_SHA256"
          echo "Actual:   $ACTUAL_CONFIG_SHA256"
          if [[ "$ACTUAL_CONFIG_SHA256" != "$EXPECTED_CONFIG_SHA256" ]]; then
            echo "::error::Reconstructed config differs from the reviewed audit candidate"
            exit 1
          fi

          # The kernel build must consume the exact, reviewed candidate.
          cp "$CANDIDATE" .config
          test "$(sha256sum .config | awk '{print $1}')" = "$EXPECTED_CONFIG_SHA256"

          echo
          echo "===== SYNCHRONIZE KCONFIG DERIVED FILES ====="
          make syncconfig

          # syncconfig must not silently change the reviewed .config.
          FINAL_CONFIG_SHA256="$(sha256sum .config | awk '{print $1}')"
          echo "Config SHA256 after syncconfig: $FINAL_CONFIG_SHA256"
          if [[ "$FINAL_CONFIG_SHA256" != "$EXPECTED_CONFIG_SHA256" ]]; then
            echo "::error::make syncconfig changed the reviewed .config"
            exit 1
          fi

          KREL="$(make -s kernelrelease)"
          echo "Kernel release: $KREL"
          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          require_config() {
            local symbol="$1"
            local expected="$2"
            local actual
            actual="$(grep -E "^$symbol=" .config || true)"
            if [[ "$actual" != "$symbol=$expected" ]]; then
              echo "::error::Configuration mismatch: $symbol"
              echo "Expected: $symbol=$expected"
              echo "Actual:   ${actual:-not set}"
              exit 1
            fi
          }

          # Required project and audio settings.
          require_config CONFIG_PREEMPT_RT y
          require_config CONFIG_HIGH_RES_TIMERS y
          require_config CONFIG_HZ_250 y
          require_config CONFIG_HZ 250
          require_config CONFIG_KERNEL_ZSTD y
          require_config CONFIG_LOCALVERSION '"-daphile-rebuild"'
          require_config CONFIG_SOUND y
          require_config CONFIG_SND y
          require_config CONFIG_SND_PCM y
          require_config CONFIG_SND_TIMER y
          require_config CONFIG_SND_HRTIMER y
          require_config CONFIG_SND_ALOOP y
          require_config CONFIG_SND_PCI y
          require_config CONFIG_SND_HDA m
          require_config CONFIG_SND_HDA_CORE m
          require_config CONFIG_SND_HDA_INTEL m
          require_config CONFIG_SND_HDA_GENERIC m
          require_config CONFIG_SND_HDA_CODEC_REALTEK m
          require_config CONFIG_SND_HDA_CODEC_HDMI m
          require_config CONFIG_SND_INTEL_DSP_CONFIG m

          # Startup-critical storage/filesystem path must remain built-in.
          require_config CONFIG_EFI y
          require_config CONFIG_EFI_STUB y
          require_config CONFIG_EFI_PARTITION y
          require_config CONFIG_PCI y
          require_config CONFIG_DEVTMPFS y
          require_config CONFIG_DEVTMPFS_MOUNT y
          require_config CONFIG_ATA y
          require_config CONFIG_SATA_AHCI y
          require_config CONFIG_SCSI y
          require_config CONFIG_BLK_DEV_SD y
          require_config CONFIG_EXT4_FS y
          require_config CONFIG_JBD2 y
          require_config CONFIG_BLK_DEV_INITRD y
          require_config CONFIG_RD_ZSTD y

          # Newly audited inventory-backed dependencies.
          require_config CONFIG_FSCACHE y
          require_config CONFIG_CACHEFILES y
          require_config CONFIG_NFS_V3_ACL y
          require_config CONFIG_NFS_ACL_SUPPORT y
          require_config CONFIG_NFS_V4_1 y
          require_config CONFIG_PNFS_BLOCK y
          require_config CONFIG_PNFS_FILE_LAYOUT y
          require_config CONFIG_PNFS_FLEXFILE_LAYOUT y

          cp .config .config.daphile-6.12.30-reconstructed
          cp "$REPORT" "$GITHUB_WORKSPACE/config-audit-report.txt"
          cp "$CANDIDATE" "$GITHUB_WORKSPACE/config-audited-candidate"

          echo
          echo "===== CONFIGURATION LOCKED FOR BUILD ====="
          echo "Kernel release: $KREL"
          echo "Candidate SHA256: $FINAL_CONFIG_SHA256"
          echo "Audit report: $GITHUB_WORKSPACE/config-audit-report.txt"
          echo "No independent localmodconfig reconstruction is performed in this build workflow."

      # --------------------------------------------------
      # 6. Build kernel
      # --------------------------------------------------

      - name: Build bzImage and modules
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail
          export CC="ccache gcc"
          ccache -M 3G

          export ARCH=x86

          echo "=================================="
          echo "Building Linux 6.12.30"
          echo "=================================="

          # Use CONFIG_LOCALVERSION from .config.
          # Never append KERNEL_SUFFIX again.

          KREL="$(make -s kernelrelease)"

          echo "Expected: $KERNEL_RELEASE"
          echo "Actual:   $KREL"

          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          make -j"${BUILD_JOBS}" bzImage modules

          test -s arch/x86/boot/bzImage

          echo "Built kernel release: $KREL"

          ls -lh arch/x86/boot/bzImage

      # --------------------------------------------------
      # 7. Install modules
      # --------------------------------------------------

      - name: Install kernel modules and verify depmod
        working-directory: linux-6.12.30
        shell: bash
        run: |
          set -Eeuo pipefail

          KREL="$(make -s kernelrelease)"
          STAGE="$GITHUB_WORKSPACE/modules-staging"
          MODDIR="$STAGE/lib/modules/$KREL"

          echo "===== KERNEL RELEASE CHECK ====="
          echo "Expected: $KERNEL_RELEASE"
          echo "Actual:   $KREL"
          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          echo
          echo "===== DISK SPACE BEFORE INSTALL ====="
          df -h "$GITHUB_WORKSPACE"
          df -i "$GITHUB_WORKSPACE"

          # Start from a clean staging directory. This prevents stale module
          # files or metadata from a previous attempt from hiding install errors.
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          echo
          echo "===== RUN MODULES_INSTALL (ONCE) ====="
          make INSTALL_MOD_PATH="$STAGE" modules_install

          if [[ ! -d "$MODDIR" ]]; then
            echo "::error::Module directory missing: $MODDIR"
            find "$STAGE" -maxdepth 5 -type d -print || true
            exit 1
          fi

          # Remove build-time links; they must not point back into the runner.
          rm -f "$MODDIR/build" "$MODDIR/source"

          echo
          echo "===== INSTALLED MODULE COUNTS ====="
          KO_COUNT=$(find "$MODDIR" -type f -name '*.ko' | wc -l)
          GZ_COUNT=$(find "$MODDIR" -type f -name '*.ko.gz' | wc -l)
          XZ_COUNT=$(find "$MODDIR" -type f -name '*.ko.xz' | wc -l)
          ZST_COUNT=$(find "$MODDIR" -type f -name '*.ko.zst' | wc -l)
          TOTAL_MODULES=$((KO_COUNT + GZ_COUNT + XZ_COUNT + ZST_COUNT))
          printf 'Uncompressed .ko: %s\n' "$KO_COUNT"
          printf 'Gzip .ko.gz:      %s\n' "$GZ_COUNT"
          printf 'XZ .ko.xz:        %s\n' "$XZ_COUNT"
          printf 'ZSTD .ko.zst:     %s\n' "$ZST_COUNT"
          printf 'Total modules:    %s\n' "$TOTAL_MODULES"

          if [[ "$TOTAL_MODULES" -eq 0 ]]; then
            echo "::error::No kernel module files were installed"
            find "$MODDIR" -maxdepth 4 -type f -print | head -100 || true
            exit 1
          fi
          
          echo "===== MODULE FILE SAMPLES ====="
          find "$MODDIR/kernel" -type f \
            \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.xz' -o -name '*.ko.zst' \) \
            -print > "$GITHUB_WORKSPACE/module-file-list.txt"
          sed -n '1,30p' "$GITHUB_WORKSPACE/module-file-list.txt"

          echo
          echo "===== DEPmod VERSION ====="
          depmod --version

          # Ubuntu's kmod may be built without ZLIB support (-ZLIB).
          # In that case depmod silently ignores .ko.gz files and can
          # produce an empty modules.dep even though modules_install worked.
          # Decompress only gzip-compressed modules before running depmod.
          # Uncompressed .ko files are supported by all kmod builds.
          echo
          echo "===== NORMALIZE GZIP MODULES FOR DEPmod ====="
          if depmod --version 2>&1 | grep -q -- '-ZLIB'; then
            echo "kmod has no ZLIB support; decompressing staged .ko.gz modules"
          else
            echo "Proceeding with gzip module normalization for maximum compatibility"
          fi

          GZIP_BEFORE=$(find "$MODDIR/kernel" -type f -name '*.ko.gz' | wc -l)
          echo "Gzip modules before normalization: $GZIP_BEFORE"

          if [[ "$GZIP_BEFORE" -gt 0 ]]; then
            while IFS= read -r -d '' MODULE; do
              gzip -t "$MODULE"
              gzip -d "$MODULE"
            done < <(find "$MODDIR/kernel" -type f -name '*.ko.gz' -print0)
          fi

          GZIP_AFTER=$(find "$MODDIR/kernel" -type f -name '*.ko.gz' | wc -l)
          KO_AFTER=$(find "$MODDIR/kernel" -type f -name '*.ko' | wc -l)
          echo "Gzip modules after normalization: $GZIP_AFTER"
          echo "Uncompressed .ko modules now:     $KO_AFTER"

          if [[ "$GZIP_AFTER" -ne 0 ]]; then
            echo "::error::Some .ko.gz modules could not be normalized"
            exit 1
          fi

          echo
          echo "===== METADATA BEFORE DEPmod ====="
          for FILE in modules.dep modules.builtin modules.order; do
            if [[ -f "$MODDIR/$FILE" ]]; then
              ls -lh "$MODDIR/$FILE"
            else
              echo "MISSING: $FILE"
            fi
          done

          # Always regenerate metadata explicitly after modules_install.
          # Capture verbose diagnostics so an empty modules.dep can be explained.
          echo
          echo "===== RUN VERBOSE DEPmod ====="
          set +e
          depmod -a -v -b "$STAGE" "$KREL" 2>&1 \
            | tee "$GITHUB_WORKSPACE/depmod-debug.log"
          DEPMOD_RC=${PIPESTATUS[0]}
          set -e
          echo "depmod exit code: $DEPMOD_RC"

          echo
          echo "===== DEPmod DRY-RUN OUTPUT ====="
          set +e
          depmod -n -v -b "$STAGE" "$KREL" \
            > "$GITHUB_WORKSPACE/depmod-dry-run.txt" 2>&1
          DRY_RC=$?
          set -e
          echo "depmod dry-run exit code: $DRY_RC"
          head -100 "$GITHUB_WORKSPACE/depmod-dry-run.txt" || true

          echo
          echo "===== MODULES.DEP AFTER DEPmod ====="
          if [[ -f "$MODDIR/modules.dep" ]]; then
            ls -lh "$MODDIR/modules.dep"
            wc -l "$MODDIR/modules.dep"
            head -30 "$MODDIR/modules.dep" || true
          else
            echo "modules.dep was not created"
          fi

          echo
          echo "===== FINAL DEPmod VALIDATION ====="
          if [[ "$DEPMOD_RC" -ne 0 ]]; then
            echo "::error::depmod failed with exit code $DEPMOD_RC"
            exit "$DEPMOD_RC"
          fi

          if [[ ! -s "$MODDIR/modules.dep" ]]; then
            echo "::error::modules.dep is empty after depmod"
            echo "Check depmod-debug.log and depmod-dry-run.txt in the workflow workspace."
            echo "Installed module count: $TOTAL_MODULES"
            exit 1
          fi

          if [[ ! -s "$MODDIR/modules.builtin" ]]; then
            echo "::error::modules.builtin missing or empty"
            exit 1
          fi

          echo "modules.dep and modules.builtin verified"
          echo
          echo "===== MODULE INSTALLATION SUCCESSFUL ====="
          du -sh "$MODDIR"
          ls -lh "$MODDIR"/modules.*
          echo
          echo "===== DISK SPACE AFTER INSTALL ====="
          df -h "$GITHUB_WORKSPACE"

      # --------------------------------------------------
      # 8. Compare official inventory
      # --------------------------------------------------

      - name: Compare official module and builtin inventory
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/$DAPHILE_DIR"

          KREL="$KERNEL_RELEASE"

          MODDIR="$GITHUB_WORKSPACE/modules-staging/lib/modules/$KREL"

          test -d "$MODDIR"

          # Official module names.

          tail -n +2 \
            "$ROOT/daphile-6.12.30-official-modules.lsmod" \
            | awk '{print $1}' \
            | sort -u \
            > "$GITHUB_WORKSPACE/official-modules.names"

          # Built module names.

          find "$MODDIR" -type f \
            \( -name '*.ko' -o -name '*.ko.xz' \
               -o -name '*.ko.zst' -o -name '*.ko.gz' \) \
            -printf '%f\n' \
            | sed -E 's/\.ko(\.(xz|zst|gz))?$//' \
            | tr '-' '_' \
            | sort -u \
            > "$GITHUB_WORKSPACE/built-modules.names"

          # Compare module names.

          comm -23 \
            "$GITHUB_WORKSPACE/official-modules.names" \
            "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-missing-from-build.txt"

          comm -13 \
            "$GITHUB_WORKSPACE/official-modules.names" \
            "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-extra-in-build.txt"

          # Official built-in object paths.

          sort -u "$ROOT/daphile-6.12.30-official-builtin.paths" \
            > "$GITHUB_WORKSPACE/official-builtin.paths.sorted"

          # Newly generated built-in object paths.

          sort -u "$MODDIR/modules.builtin" \
            > "$GITHUB_WORKSPACE/built-builtin.paths"

          comm -23 \
            "$GITHUB_WORKSPACE/official-builtin.paths.sorted" \
            "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"

          comm -13 \
            "$GITHUB_WORKSPACE/official-builtin.paths.sorted" \
            "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-extra-in-build.txt"

          # Generate comparison report.

          {
            echo "Daphile 6.12.30 inventory comparison"
            echo "===================================="
            echo
            echo "Kernel release: $KREL"
            echo
            echo "Official modules: $(wc -l < "$GITHUB_WORKSPACE/official-modules.names")"
            echo "Built modules: $(wc -l < "$GITHUB_WORKSPACE/built-modules.names")"
            echo "Missing modules: $(wc -l < "$GITHUB_WORKSPACE/modules-missing-from-build.txt")"
            echo "Extra modules: $(wc -l < "$GITHUB_WORKSPACE/modules-extra-in-build.txt")"
            echo
            echo "Official builtins: $(wc -l < "$GITHUB_WORKSPACE/official-builtin.paths.sorted")"
            echo "Built builtins: $(wc -l < "$GITHUB_WORKSPACE/built-builtin.paths")"
            echo "Missing builtins: $(wc -l < "$GITHUB_WORKSPACE/builtin-missing-from-build.txt")"
            echo "Extra builtins: $(wc -l < "$GITHUB_WORKSPACE/builtin-extra-in-build.txt")"
          } | tee "$GITHUB_WORKSPACE/inventory-comparison.txt"

          echo
          echo "Missing module examples:"
          head -n 30 "$GITHUB_WORKSPACE/modules-missing-from-build.txt"

          echo
          echo "Missing builtin examples:"
          head -n 30 "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"

      # --------------------------------------------------
      # 9. Package modules
      # --------------------------------------------------

      - name: Package modules.tar.gz
        run: |
          set -euo pipefail

          KREL="$KERNEL_RELEASE"

          STAGE="$GITHUB_WORKSPACE/modules-staging"

          MODDIR="$STAGE/lib/modules/$KREL"

          test -d "$MODDIR"
          test -s "$MODDIR/modules.dep"
          test -s "$MODDIR/modules.builtin"

          cd "$STAGE/lib/modules"

          tar \
            --numeric-owner \
            -czf "$GITHUB_WORKSPACE/modules.tar.gz" \
            "$KREL"

          test -s "$GITHUB_WORKSPACE/modules.tar.gz"

          echo "Module archive:"
          ls -lh "$GITHUB_WORKSPACE/modules.tar.gz"

          echo
          echo "Archive verification:"

          tar -tzf "$GITHUB_WORKSPACE/modules.tar.gz" > "$GITHUB_WORKSPACE/modules-archive-list.txt"
          sed -n '1,20p' "$GITHUB_WORKSPACE/modules-archive-list.txt"

      # --------------------------------------------------
      # 10. Prepare final artifacts
      # --------------------------------------------------

      - name: Prepare release artifacts
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail

          # Kernel image.

          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/bzImage"

          # Final configuration.

          cp .config "$GITHUB_WORKSPACE/config"

          # Verify artifacts.

          test -s "$GITHUB_WORKSPACE/bzImage"
          test -s "$GITHUB_WORKSPACE/config"
          test -s "$GITHUB_WORKSPACE/modules.tar.gz"
          test -f "$GITHUB_WORKSPACE/depmod-debug.log"
          test -f "$GITHUB_WORKSPACE/depmod-dry-run.txt"
          test -s "$GITHUB_WORKSPACE/inventory-comparison.txt"
          
          # Verify final configuration.

          grep -q '^CONFIG_KERNEL_ZSTD=y$' "$GITHUB_WORKSPACE/config"

          grep -q '^CONFIG_PREEMPT_RT=y$' "$GITHUB_WORKSPACE/config"
          grep -q '^CONFIG_HZ_250=y$' "$GITHUB_WORKSPACE/config"
          grep -q '^CONFIG_HZ=250$' "$GITHUB_WORKSPACE/config"

          if grep -qE '^CONFIG_MODULE_SIG_(ALL|FORCE)=y$|^CONFIG_IMA_APPRAISE_MODSIG=y$' "$GITHUB_WORKSPACE/config"; then
            echo "::error::Module-signature option unexpectedly enabled in exported config:"
            grep -E '^CONFIG_MODULE_SIG_(ALL|FORCE)=y$|^CONFIG_IMA_APPRAISE_MODSIG=y$' "$GITHUB_WORKSPACE/config" || true
            exit 1
          fi

          grep -q '^CONFIG_SYSTEM_TRUSTED_KEYS=""$' "$GITHUB_WORKSPACE/config"
          grep -q '^CONFIG_SYSTEM_REVOCATION_KEYS=""$' "$GITHUB_WORKSPACE/config"

          grep -q '^CONFIG_LOCALVERSION="-daphile-rebuild"$' "$GITHUB_WORKSPACE/config"

          # Generate SHA256 checksums.

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            bzImage \
            config \
            modules.tar.gz \
            depmod-debug.log \
            depmod-dry-run.txt \
            inventory-comparison.txt \
            > SHA256SUMS.txt

          echo "=================================="
          echo "Release artifacts"
          echo "=================================="

          ls -lh \
            bzImage \
            config \
            modules.tar.gz \
            depmod-debug.log \
            depmod-dry-run.txt \
            inventory-comparison.txt \
            SHA256SUMS.txt

          echo
          echo "Final kernel compression:"
          grep '^CONFIG_KERNEL_ZSTD=y$' config

          echo
          echo "Final kernel version:"
          grep '^CONFIG_LOCALVERSION=' config

          echo
          echo "SHA256:"
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 11. Publish GitHub Release
      # --------------------------------------------------

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          tag: kernel-6.12.30-daphile-rebuild

          name: Daphile 6.12.30 PREEMPT_RT Rebuild

          commit: master

          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: false

          body: |
            Daphile Linux 6.12.30 PREEMPT_RT reconstructed kernel.

            Architecture: x86_64
            Kernel: Linux 6.12.30
            Kernel release: 6.12.30-daphile-rebuild

            PREEMPT_RT: enabled
            Kernel compression: ZSTD
            Local version: -daphile-rebuild

            Configuration reconstructed using:
            - Official Daphile module inventory
            - Official modules.builtin inventory
            - Evidence-backed Kconfig fragment

            Important:
            This is a reconstructed configuration, not the original
            byte-for-byte Daphile configuration.

            Keep the original 6.12.30-daphile kernel as fallback.

          artifacts: |
            bzImage
            config
            modules.tar.gz
            depmod-debug.log
            depmod-dry-run.txt
            inventory-comparison.txt
            modules-missing-from-build.txt
            modules-extra-in-build.txt
            builtin-missing-from-build.txt
            builtin-extra-in-build.txt
            SHA256SUMS.txt
