
name: Build Daphile 6.12.30 PREEMPT_RT Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daphile-6.12.30-rebuild
  cancel-in-progress: false

env:
  DAPHILE_DIR: 6.12.30-daphile
  KERNEL_VERSION: 6.12.30
  KERNEL_SUFFIX: -daphile-rebuild
  KERNEL_RELEASE: 6.12.30-daphile-rebuild

jobs:
  build:
    name: Reconstruct and build Linux 6.12.30
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Free disk space
      # --------------------------------------------------

      - name: Free runner disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL || true

          sudo apt-get clean

          df -h

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install kernel build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            xz-utils \
            zstd \
            cpio \
            dwarves \
            kmod \
            perl \
            python3 \
            rsync \
            wget \
            git

      # --------------------------------------------------
      # 4. Download exact Linux 6.12.30
      # --------------------------------------------------

      - name: Download Linux 6.12.30 source
        run: |
          set -euo pipefail

          wget -q \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.30.tar.xz

          tar -xJf linux-6.12.30.tar.xz

          test -f linux-6.12.30/Makefile

          cd linux-6.12.30

          VERSION="$(make -s kernelversion)"

          echo "Kernel source version: $VERSION"

          if [[ "$VERSION" != "6.12.30" ]]; then
            echo "::error::Unexpected kernel source version: $VERSION"
            exit 1
          fi

      # --------------------------------------------------
      # 5. Reconstruct configuration
      # --------------------------------------------------

      - name: Reconstruct config from official module inventory
        shell: bash
        working-directory: linux-6.12.30
        env:
          DAPHILE_DIR: 6.12.30-daphile
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "Daphile Linux 6.12.30 config reconstruction"
          echo "=========================================="

          MODS="../${DAPHILE_DIR}/daphile-6.12.30-official-modules.lsmod"
          BUILTINS="../${DAPHILE_DIR}/daphile-6.12.30-official-builtin.lsmod"
          BUILTIN_PATHS="../${DAPHILE_DIR}/daphile-6.12.30-official-builtin.paths"
          FRAGMENT="../${DAPHILE_DIR}/daphile-6.12.30-confirmed-v2.fragment"

          # --------------------------------------------------
          # 1. Check source tree and inventory files
          # --------------------------------------------------

          test -f Makefile
          test -x scripts/kconfig/streamline_config.pl
          test -f "$MODS"
          test -f "$BUILTINS"
          test -f "$BUILTIN_PATHS"
          test -f "$FRAGMENT"

          echo
          echo "===== INVENTORY FILES ====="

          wc -l "$MODS" "$BUILTINS" "$BUILTIN_PATHS"

          # --------------------------------------------------
          # 2. Count official module inventories
          # --------------------------------------------------

          MOD_COUNT=$(awk 'NR > 1 && NF {count++} END {print count+0}' "$MODS")
          BUILTIN_COUNT=$(awk 'NR > 1 && NF {count++} END {print count+0}' "$BUILTINS")
          BUILTIN_PATH_COUNT=$(grep -c '^kernel/.*\.ko$' "$BUILTIN_PATHS" || true)

          echo "Official loadable modules : $MOD_COUNT"
          echo "Official built-in objects : $BUILTIN_COUNT"
          echo "Built-in module paths     : $BUILTIN_PATH_COUNT"

          if [[ "$MOD_COUNT" -eq 0 || "$BUILTIN_COUNT" -eq 0 ]]; then
            echo "::error::Official module inventory is empty"
            exit 1
          fi

          # --------------------------------------------------
          # 3. Helper for Kconfig local*config commands
          # --------------------------------------------------

          run_local_config() {
            local inventory="$1"
            local target="$2"
            local rc

            echo
            echo "===== Running make $target ====="
            echo "LSMOD=$inventory"

            set +o pipefail

            if yes "" | env LSMOD="$inventory" make "$target"; then
              rc=0
            else
              rc=$?
            fi

            set -o pipefail

            if [[ "$rc" -ne 0 ]]; then
              echo "::error::make $target failed with exit code $rc"
              return "$rc"
            fi
          }

          # --------------------------------------------------
          # 4. Pass A: identify official built-in objects
          # --------------------------------------------------

          echo
          echo "===== PASS A: BUILT-IN DETECTION ====="

          make allmodconfig
          cp .config .config.allmodconfig

          run_local_config "$BUILTINS" localyesconfig

          cp .config .config.builtin-probe

          # Extract only symbols changed from m to y.

          awk '
            FNR == NR {
              if ($0 ~ /^CONFIG_[A-Za-z0-9_]+=m$/) {
                split($0, a, "=")
                was_m[a[1]] = 1
              }
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=y$/ {
              split($0, a, "=")
              if (a[1] in was_m)
                print
            }
          ' .config.allmodconfig .config.builtin-probe \
            | sort -u > .daphile-builtin-y.fragment

          echo
          echo "Detected built-in configuration transitions:"

          wc -l .daphile-builtin-y.fragment

          # --------------------------------------------------
          # 5. Pass B: reconstruct official loadable modules
          # --------------------------------------------------

          echo
          echo "===== PASS B: MODULE DETECTION ====="

          make allmodconfig

          run_local_config "$MODS" localmodconfig

          cp .config .config.localmodconfig

          # --------------------------------------------------
          # 6. Merge confirmed built-in configuration
          # --------------------------------------------------

          echo
          echo "===== MERGE BUILT-IN CONFIGURATION ====="

          ./scripts/kconfig/merge_config.sh \
            -m \
            -O . \
            .config \
            .daphile-builtin-y.fragment

          # --------------------------------------------------
          # 7. Apply confirmed Daphile configuration
          # --------------------------------------------------

          echo
          echo "===== APPLY CONFIRMED CONFIGURATION ====="

          ./scripts/config --enable EXPERT
          ./scripts/config --enable X86_64
          ./scripts/config --enable SMP
          ./scripts/config --enable PCI
          ./scripts/config --enable INPUT

          ./scripts/config --enable MODULES
          ./scripts/config --enable MODULE_UNLOAD

          ./scripts/config --enable PREEMPT_RT
          ./scripts/config --enable HIGH_RES_TIMERS

          # ALSA core: built-in

          ./scripts/config --enable SOUND
          ./scripts/config --enable SND
          ./scripts/config --enable SND_PCM
          ./scripts/config --enable SND_TIMER
          ./scripts/config --enable SND_HRTIMER
          ./scripts/config --enable SND_ALOOP
          ./scripts/config --enable SND_PCI

          # Intel HDA stack: modules

          ./scripts/config --module SND_HDA
          ./scripts/config --module SND_HDA_CORE
          ./scripts/config --module SND_HDA_INTEL
          ./scripts/config --module SND_HDA_GENERIC
          ./scripts/config --module SND_HDA_CODEC_REALTEK
          ./scripts/config --module SND_HDA_CODEC_HDMI
          ./scripts/config --module SND_INTEL_DSP_CONFIG

          # Kernel image compression: ZSTD

          ./scripts/config --enable KERNEL_ZSTD

          # Kernel version suffix

          ./scripts/config --set-str LOCALVERSION "-daphile-rebuild"
          ./scripts/config --disable LOCALVERSION_AUTO

          # --------------------------------------------------
          # 8. Resolve Kconfig dependencies
          # --------------------------------------------------

          echo
          echo "===== KCONFIG OLDDEFCONFIG ====="

          make olddefconfig

          # --------------------------------------------------
          # 9. Verify kernel compression mode
          # --------------------------------------------------

          echo
          echo "===== KERNEL COMPRESSION CHECK ====="

          KERNEL_COMPRESSIONS=$(grep -E '^CONFIG_KERNEL_[A-Z0-9_]+=y$' .config || true)

          echo "$KERNEL_COMPRESSIONS"

          if [[ "$KERNEL_COMPRESSIONS" != "CONFIG_KERNEL_ZSTD=y" ]]; then
            echo "::error::Kernel compression mode is not exclusively ZSTD"
            exit 1
          fi

          grep -q '^CONFIG_KERNEL_ZSTD=y$' .config || {
            echo "::error::CONFIG_KERNEL_ZSTD is not enabled"
            exit 1
          }

          echo "Kernel compression: ZSTD"

          # --------------------------------------------------
          # 10. Verify local version
          # --------------------------------------------------

          echo
          echo "===== LOCALVERSION CHECK ====="

          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|# CONFIG_LOCALVERSION_AUTO)' .config || true

          # --------------------------------------------------
          # 11. Verify kernel release
          # --------------------------------------------------

          echo
          echo "===== KERNEL RELEASE CHECK ====="

          KREL=$(make -s LOCALVERSION=-daphile-rebuild kernelrelease)

          echo "Kernel release: $KREL"

          if [[ "$KREL" != "6.12.30-daphile-rebuild" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          echo "Kernel release verification successful"

          # --------------------------------------------------
          # 12. Verify important configuration values
          # --------------------------------------------------

          require_config() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual=$(grep -E "^${symbol}=" .config || true)

            if [[ "$actual" != "${symbol}=${expected}" ]]; then
              echo "::error::Configuration mismatch: ${symbol}"
              echo "Expected: ${symbol}=${expected}"
              echo "Actual:   ${actual:-not set}"
              exit 1
            fi
          }

          require_config CONFIG_X86_64 y
          require_config CONFIG_SMP y
          require_config CONFIG_PREEMPT_RT y
          require_config CONFIG_MODULES y
          require_config CONFIG_MODULE_UNLOAD y
          require_config CONFIG_HIGH_RES_TIMERS y

          require_config CONFIG_LOCALVERSION '"-daphile-rebuild"'

          require_config CONFIG_KERNEL_ZSTD y

          require_config CONFIG_SOUND y
          require_config CONFIG_SND y
          require_config CONFIG_SND_PCM y
          require_config CONFIG_SND_TIMER y
          require_config CONFIG_SND_HRTIMER y
          require_config CONFIG_SND_ALOOP y

          require_config CONFIG_SND_HDA m
          require_config CONFIG_SND_HDA_CORE m
          require_config CONFIG_SND_HDA_INTEL m
          require_config CONFIG_SND_HDA_GENERIC m
          require_config CONFIG_SND_HDA_CODEC_REALTEK m
          require_config CONFIG_SND_HDA_CODEC_HDMI m
          require_config CONFIG_SND_INTEL_DSP_CONFIG m

          # --------------------------------------------------
          # 13. Save reconstructed configuration
          # --------------------------------------------------

          cp .config .config.daphile-6.12.30-reconstructed

          echo
          echo "===== FINAL CONFIGURATION ====="

          grep -E \
            '^(CONFIG_(KERNEL_ZSTD|LOCALVERSION|HIGH_RES_TIMERS|PREEMPT_RT|EXPERT|X86_64|SMP|MODULES|MODULE_UNLOAD|SOUND|SND|SND_PCM|SND_TIMER|SND_HRTIMER|SND_ALOOP|SND_PCI|SND_HDA|SND_HDA_CORE|SND_HDA_INTEL|SND_HDA_GENERIC|SND_HDA_CODEC_REALTEK|SND_HDA_CODEC_HDMI|SND_INTEL_DSP_CONFIG))=' \
            .config || true

          echo
          echo "=========================================="
          echo "CONFIG RECONSTRUCTION SUCCESSFUL"
          echo "=========================================="

          echo "Kernel release: $KREL"
          echo "Config file: .config"
          echo "Backup: .config.daphile-6.12.30-reconstructed"
          echo "Built-in transitions: $(wc -l < .daphile-builtin-y.fragment)"
          echo "Kernel compression: ZSTD"
          echo "=========================================="

      # --------------------------------------------------
      # 6. Build kernel
      # --------------------------------------------------

      - name: Build bzImage and modules
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail

          export ARCH=x86

          echo "=================================="
          echo "Building Linux 6.12.30"
          echo "=================================="

          KREL="$(make -s LOCALVERSION=-daphile-rebuild kernelrelease)"

          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          make LOCALVERSION=-daphile-rebuild -j"$(nproc)" bzImage modules

          test -s arch/x86/boot/bzImage

          echo "Built kernel release: $KREL"

          ls -lh arch/x86/boot/bzImage

      # --------------------------------------------------
      # 7. Install modules
      # --------------------------------------------------

      - name: Install kernel modules
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail

          KREL="$(make -s LOCALVERSION=-daphile-rebuild kernelrelease)"

          if [[ "$KREL" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          STAGE="$GITHUB_WORKSPACE/modules-staging"

          make LOCALVERSION=-daphile-rebuild \
            INSTALL_MOD_PATH="$STAGE" \
            modules_install

          MODDIR="$STAGE/lib/modules/$KREL"

          test -d "$MODDIR"

          # Remove build-time source links if present.

          rm -f "$MODDIR/build" "$MODDIR/source"

          # Regenerate module dependency metadata.

          depmod -b "$STAGE" "$KREL"

          test -s "$MODDIR/modules.dep"
          test -s "$MODDIR/modules.builtin"

          echo "Installed module directory:"
          du -sh "$MODDIR"

      # --------------------------------------------------
      # 8. Compare official inventory
      # --------------------------------------------------

      - name: Compare official module and builtin inventory
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/$DAPHILE_DIR"

          KREL="$KERNEL_RELEASE"

          MODDIR="$GITHUB_WORKSPACE/modules-staging/lib/modules/$KREL"

          # Official module names.

          tail -n +2 \
            "$ROOT/daphile-6.12.30-official-modules.lsmod" \
            | awk '{print $1}' \
            | sort -u \
            > "$GITHUB_WORKSPACE/official-modules.names"

          # Built module names.

          find "$MODDIR" -type f \
            \( -name '*.ko' -o -name '*.ko.xz' \
               -o -name '*.ko.zst' -o -name '*.ko.gz' \) \
            -printf '%f\n' \
            | sed -E 's/\.ko(\.(xz|zst|gz))?$//' \
            | tr '-' '_' \
            | sort -u \
            > "$GITHUB_WORKSPACE/built-modules.names"

          # Compare module names.

          comm -23 \
            "$GITHUB_WORKSPACE/official-modules.names" \
            "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-missing-from-build.txt"

          comm -13 \
            "$GITHUB_WORKSPACE/official-modules.names" \
            "$GITHUB_WORKSPACE/built-modules.names" \
            > "$GITHUB_WORKSPACE/modules-extra-in-build.txt"

          # Official built-in object paths.

          sort -u "$ROOT/daphile-6.12.30-official-builtin.paths" \
            > "$GITHUB_WORKSPACE/official-builtin.paths.sorted"

          # Newly generated built-in object paths.

          sort -u "$MODDIR/modules.builtin" \
            > "$GITHUB_WORKSPACE/built-builtin.paths"

          comm -23 \
            "$GITHUB_WORKSPACE/official-builtin.paths.sorted" \
            "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"

          comm -13 \
            "$GITHUB_WORKSPACE/official-builtin.paths.sorted" \
            "$GITHUB_WORKSPACE/built-builtin.paths" \
            > "$GITHUB_WORKSPACE/builtin-extra-in-build.txt"

          # Generate comparison report.

          {
            echo "Daphile 6.12.30 inventory comparison"
            echo "===================================="
            echo
            echo "Kernel release: $KREL"
            echo
            echo "Official modules: $(wc -l < "$GITHUB_WORKSPACE/official-modules.names")"
            echo "Built modules: $(wc -l < "$GITHUB_WORKSPACE/built-modules.names")"
            echo "Missing modules: $(wc -l < "$GITHUB_WORKSPACE/modules-missing-from-build.txt")"
            echo "Extra modules: $(wc -l < "$GITHUB_WORKSPACE/modules-extra-in-build.txt")"
            echo
            echo "Official builtins: $(wc -l < "$GITHUB_WORKSPACE/official-builtin.paths.sorted")"
            echo "Built builtins: $(wc -l < "$GITHUB_WORKSPACE/built-builtin.paths")"
            echo "Missing builtins: $(wc -l < "$GITHUB_WORKSPACE/builtin-missing-from-build.txt")"
            echo "Extra builtins: $(wc -l < "$GITHUB_WORKSPACE/builtin-extra-in-build.txt")"
          } | tee "$GITHUB_WORKSPACE/inventory-comparison.txt"

          echo
          echo "Missing module examples:"
          head -n 30 "$GITHUB_WORKSPACE/modules-missing-from-build.txt"

          echo
          echo "Missing builtin examples:"
          head -n 30 "$GITHUB_WORKSPACE/builtin-missing-from-build.txt"

      # --------------------------------------------------
      # 9. Package modules
      # --------------------------------------------------

      - name: Package modules.tar.gz
        run: |
          set -euo pipefail

          KREL="$KERNEL_RELEASE"

          STAGE="$GITHUB_WORKSPACE/modules-staging"

          MODDIR="$STAGE/lib/modules/$KREL"

          test -d "$MODDIR"
          test -s "$MODDIR/modules.dep"

          cd "$STAGE/lib/modules"

          tar \
            --numeric-owner \
            -czf "$GITHUB_WORKSPACE/modules.tar.gz" \
            "$KREL"

          test -s "$GITHUB_WORKSPACE/modules.tar.gz"

          ls -lh "$GITHUB_WORKSPACE/modules.tar.gz"

      # --------------------------------------------------
      # 10. Prepare final artifacts
      # --------------------------------------------------

      - name: Prepare release artifacts
        working-directory: linux-6.12.30
        run: |
          set -euo pipefail

          # Kernel image.

          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/bzImage"

          # Final configuration used for this build.

          cp .config "$GITHUB_WORKSPACE/config"

          # Verify all artifacts.

          test -s "$GITHUB_WORKSPACE/bzImage"
          test -s "$GITHUB_WORKSPACE/config"
          test -s "$GITHUB_WORKSPACE/modules.tar.gz"
          test -s "$GITHUB_WORKSPACE/inventory-comparison.txt"

          echo "=================================="
          echo "Release artifacts"
          echo "=================================="

          ls -lh \
            "$GITHUB_WORKSPACE/bzImage" \
            "$GITHUB_WORKSPACE/config" \
            "$GITHUB_WORKSPACE/modules.tar.gz" \
            "$GITHUB_WORKSPACE/inventory-comparison.txt"

          echo
          echo "Final kernel compression:"
          grep '^CONFIG_KERNEL_ZSTD=y$' "$GITHUB_WORKSPACE/config"

          echo
          echo "Final kernel version:"
          grep '^CONFIG_LOCALVERSION=' "$GITHUB_WORKSPACE/config"

      # --------------------------------------------------
      # 11. Publish GitHub Release
      # --------------------------------------------------

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          tag: kernel-6.12.30-daphile-rebuild

          name: Daphile 6.12.30 PREEMPT_RT Rebuild

          commit: ${{ github.sha }}

          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: false

          body: |
            Daphile Linux 6.12.30 PREEMPT_RT reconstructed kernel.

            Architecture: x86_64
            Kernel: Linux 6.12.30
            PREEMPT_RT: enabled
            Local version: -daphile-rebuild
            Kernel compression: ZSTD

            Configuration reconstructed using:
            - Official Daphile module inventory
            - Official modules.builtin inventory
            - Evidence-backed Kconfig fragment

            Important:
            This is a reconstructed configuration, not the original
            byte-for-byte Daphile configuration.

            Keep the original 6.12.30-daphile kernel as fallback.

          artifacts: |
            bzImage
            config
            modules.tar.gz
            inventory-comparison.txt
            modules-missing-from-build.txt
            modules-extra-in-build.txt
            builtin-missing-from-build.txt
            builtin-extra-in-build.txt
