name: 编译Bootable IMG(rootfs + modules + bzImage)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (must match modules/bzImage)'
        required: false
        default: '6.12.115'
  push:
    tags:
      - 'img-*'

permissions:
  contents: write

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.115' }}
  IMG_SIZE_MB: 4096
  WORK_DIR: ${{ github.workspace }}/work
  IMG_FILE: ${{ github.workspace }}/work/debian-rootfs.img
  ROOTFS_URL: https://github.com/rmoyulong/Template/releases/download/rootfs-bookworm-latest/rootfs.tar.gz
  MODULES_URL: https://github.com/rmoyulong/Template/releases/download/kernel-modules-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8/modules.tar.gz
  BZIMAGE_URL: https://github.com/rmoyulong/Template/releases/download/kernel-image-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8/bzImage

jobs:
  build-img:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget parted e2fsprogs dosfstools \
            grub-pc-bin grub-efi-amd64-bin grub-common \
            mtools xorriso rsync dos2unix

      - name: Download rootfs, modules, bzImage
        run: |
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          wget -q -O rootfs.tar.gz "$ROOTFS_URL"
          wget -q -O modules.tar.gz "$MODULES_URL"
          wget -q -O bzImage "$BZIMAGE_URL"
          ls -lh

      - name: Create disk image and partitions
        run: |
          cd "$WORK_DIR"
          dd if=/dev/zero of="$IMG_FILE" bs=1M count=$IMG_SIZE_MB status=progress

          parted -s "$IMG_FILE" mklabel gpt
          parted -s "$IMG_FILE" mkpart biosboot 1MiB 3MiB
          parted -s "$IMG_FILE" set 1 bios_grub on
          parted -s "$IMG_FILE" mkpart efi fat32 3MiB 103MiB
          parted -s "$IMG_FILE" set 2 esp on
          parted -s "$IMG_FILE" mkpart root ext4 103MiB 100%

          LOOP=$(sudo losetup --find --show --partscan "$IMG_FILE")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sleep 2
          lsblk "$LOOP"

          sudo mkfs.fat -F32 "${LOOP}p2"
          sudo mkfs.ext4 -F -L rootfs "${LOOP}p3"

      - name: Populate rootfs
        run: |
          LOOP="${{ env.LOOP }}"
          sudo mkdir -p /mnt/rootfs /mnt/efi
          sudo mount "${LOOP}p3" /mnt/rootfs
          sudo mount "${LOOP}p2" /mnt/efi

          # 解压 rootfs
          sudo tar -xzf "$WORK_DIR/rootfs.tar.gz" -C /mnt/rootfs --numeric-owner
          
          # 放入把系统安装到硬盘的脚本
          INSTALLER_SRC="/home/runner/work/Template/Template/patch/install.sh"
          if [ ! -f "$INSTALLER_SRC" ]; then
            echo "ERROR: $INSTALLER_SRC 不存在"
            exit 1
          fi
          sudo mkdir -p /mnt/rootfs/root
          sudo cp "$INSTALLER_SRC" /mnt/rootfs/root/install.sh
          sudo chmod 755 /mnt/rootfs/root/install.sh
          sudo sed -i 's/\r$//' /mnt/rootfs/root/install.sh
          echo "=== 安装脚本已放入 /root/install.sh ==="
          ls -l /mnt/rootfs/root/install.sh

          # 解压 modules 到临时目录
          rm -rf /tmp/modules-extract
          mkdir -p /tmp/modules-extract
          sudo tar -xzf "$WORK_DIR/modules.tar.gz" -C /tmp/modules-extract

          echo "=== modules.tar.gz 解压后的顶层目录 ==="
          sudo find /tmp/modules-extract -maxdepth 1 -mindepth 1

          # 检查 bzImage 内部版本字符串，辅助确认 KERNEL_VERSION 是否匹配
          echo "=== bzImage 内部版本字符串 ==="
          strings "$WORK_DIR/bzImage" | grep -m1 -o '6\.12\.[0-9]*[^ ]*' || true

          VERSION_DIR=$(sudo find /tmp/modules-extract -maxdepth 4 -type d -name "${KERNEL_VERSION}" -print -quit)
          if [ -z "$VERSION_DIR" ]; then
            echo "ERROR: 在 modules.tar.gz 中找不到 ${KERNEL_VERSION} 目录"
            sudo find /tmp/modules-extract -maxdepth 2 -type d
            exit 1
          fi
          echo "找到模块目录: $VERSION_DIR"

          sudo mkdir -p /mnt/rootfs/lib/modules
          sudo rm -rf "/mnt/rootfs/lib/modules/${KERNEL_VERSION}"
          sudo mv "$VERSION_DIR" "/mnt/rootfs/lib/modules/${KERNEL_VERSION}"

          # 放置内核
          sudo mkdir -p /mnt/rootfs/boot
          sudo cp "$WORK_DIR/bzImage" "/mnt/rootfs/boot/vmlinuz-${KERNEL_VERSION}"

          echo "=== /mnt/rootfs/lib/modules 内容 ==="
          ls -la /mnt/rootfs/lib/modules/
          echo "=== /mnt/rootfs/boot 内容 ==="
          ls -la /mnt/rootfs/boot/

      - name: Generate initramfs and install GRUB (chroot)
        run: |
          LOOP="${{ env.LOOP }}"

          # 准备 chroot 挂载
          sudo mount --bind /dev  /mnt/rootfs/dev
          sudo mount --bind /proc /mnt/rootfs/proc
          sudo mount --bind /sys  /mnt/rootfs/sys

          # 检查必要工具
          if [ ! -x /mnt/rootfs/usr/sbin/update-initramfs ]; then
            echo "ERROR: rootfs 中没有 update-initramfs，请重建 rootfs 并加入 initramfs-tools"
            exit 1
          fi
          if [ ! -x /mnt/rootfs/sbin/depmod ]; then
            echo "ERROR: rootfs 中没有 depmod，请重建 rootfs 并加入 kmod"
            exit 1
          fi

          # 伪造内核 config，让 update-initramfs 的压缩检查通过
          sudo tee "/mnt/rootfs/boot/config-${KERNEL_VERSION}" > /dev/null <<'EOF'
          CONFIG_RD_GZIP=y
          CONFIG_RD_BZIP2=y
          CONFIG_RD_LZMA=y
          CONFIG_RD_XZ=y
          CONFIG_RD_LZO=y
          CONFIG_RD_LZ4=y
          CONFIG_RD_ZSTD=y
          EOF

          # 确保压缩方式为 gzip
          sudo mkdir -p /mnt/rootfs/etc/initramfs-tools
          if [ -f /mnt/rootfs/etc/initramfs-tools/initramfs.conf ]; then
            sudo sed -i 's/^COMPRESS=.*/COMPRESS=gzip/' /mnt/rootfs/etc/initramfs-tools/initramfs.conf
          else
            echo "COMPRESS=gzip" | sudo tee /mnt/rootfs/etc/initramfs-tools/initramfs.conf
          fi

          # depmod 重建模块依赖
          echo "=== 执行 depmod ==="
          sudo chroot /mnt/rootfs /bin/bash -c "depmod -a ${KERNEL_VERSION}"

          # 生成 initramfs
          echo "=== 执行 update-initramfs ==="
          sudo chroot /mnt/rootfs /bin/bash -c "update-initramfs -c -k ${KERNEL_VERSION}"

          # 确认 initrd 存在
          if [ ! -f "/mnt/rootfs/boot/initrd.img-${KERNEL_VERSION}" ]; then
            echo "ERROR: initramfs 生成失败，/boot/initrd.img-${KERNEL_VERSION} 不存在"
            ls -la /mnt/rootfs/boot/
            exit 1
          fi
          echo "initramfs 生成成功"

          # 写 fstab（用 LABEL 定位根分区）
          sudo tee /mnt/rootfs/etc/fstab > /dev/null <<'EOF'
          # <file system> <mount point> <type> <options> <dump> <pass>
          LABEL=rootfs  /  ext4  errors=remount-ro  0  1
          EOF

          # 安装 GRUB 软件包（若 rootfs 中已存在则跳过）
          echo "=== 安装 GRUB 软件包 ==="
          sudo chroot /mnt/rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v grub-install >/dev/null 2>&1; then
              apt-get update || true
              apt-get install -y grub-pc grub-efi-amd64 || true
            fi
          "

          # chroot 内安装 GRUB 到镜像
          echo "=== chroot 内安装 GRUB ==="
          sudo chroot /mnt/rootfs /bin/bash -c "
            grub-install --target=i386-pc --recheck ${LOOP} || true
            grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=debian --recheck || true
          "

          # 如果 chroot 安装失败，用宿主机 grub 回退
          if [ ! -f /mnt/rootfs/boot/grub/i386-pc/normal.mod ]; then
            echo "chroot grub-install 失败，使用宿主机 grub 回退"
            sudo grub-install --target=i386-pc --boot-directory=/mnt/rootfs/boot "${LOOP}" || true
          fi

          # 手动写 grub.cfg，确保内核和 initrd 路径正确
          echo "=== 写入 grub.cfg ==="
          sudo mkdir -p /mnt/rootfs/boot/grub
          sudo tee /mnt/rootfs/boot/grub/grub.cfg > /dev/null <<EOF
          set default=0
          set timeout=5

          menuentry "Debian ${KERNEL_VERSION}" {
              linux /boot/vmlinuz-${KERNEL_VERSION} root=LABEL=rootfs rw quiet
              initrd /boot/initrd.img-${KERNEL_VERSION}
          }

          menuentry "Debian ${KERNEL_VERSION} (recovery)" {
              linux /boot/vmlinuz-${KERNEL_VERSION} root=LABEL=rootfs rw single
              initrd /boot/initrd.img-${KERNEL_VERSION}
          }
          EOF

          # 卸载 chroot 挂载
          sudo umount /mnt/rootfs/dev  || true
          sudo umount /mnt/rootfs/proc || true
          sudo umount /mnt/rootfs/sys  || true

      - name: Cleanup and unmount
        run: |
          LOOP="${{ env.LOOP }}"
          sudo umount /mnt/rootfs || true
          sudo umount /mnt/efi || true
          sudo losetup -d "$LOOP" || true

      - name: Compress image
        run: |
          cd "$WORK_DIR"
          gzip -9 -k "$IMG_FILE"
          ls -lh
          ( cd "$WORK_DIR" && sha256sum debian-rootfs.img.gz > debian-rootfs.img.gz.sha256 )

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          tag: img-debian-${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: Bootable IMG ${{ env.KERNEL_VERSION }} build ${{ github.run_number }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: ${{ env.WORK_DIR }}/*.img.gz*
          body: |
            可启动 Debian IMG（x86_64）
            内核：${{ env.KERNEL_VERSION }}
            rootfs：Debian bookworm + SSH/FTP/Nginx/PHP8
            初始 root 密码：`1234`（首次 SSH 登录强制改密）
            写入 U 盘或者硬盘：
            # 先确认设备（X 是目标盘，如 sdb）
            lsblk -o NAME,SIZE,MODEL,TRAN,MOUNTPOINT
            # 确认后卸载该盘所有分区（把 sdX 换成实际盘符）
            sudo umount /dev/sdX?* 2>/dev/null || true
            # 写入
            gunzip -c debian-rootfs.img.gz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
            sudo sync
            在安装好的机器上扩展目标硬盘空间
            # 查看根分区设备
            findmnt /
            # 假设输出 /dev/sda3，整盘是 /dev/sda，分区号是 3
            sudo growpart /dev/sda 3
            sudo resize2fs /dev/sda3
            
            或者写一个bash处理文件：
            sudo apt install -y cloud-guest-utils   # 提供 growpart
            ROOT_PART=$(findmnt -n -o SOURCE /)
            ROOT_DISK=$(lsblk -no PKNAME "$ROOT_PART")
            PART_NUM=$(cat /sys/class/block/$(basename "$ROOT_PART")/partition)
            sudo growpart "/dev/$ROOT_DISK" "$PART_NUM"
            sudo resize2fs "$ROOT_PART"            