name: "官方版编译玩客云三代 Armbian"
on:
  workflow_dispatch:
     inputs:
      branch_version:
        type: choice
        description: 选择源码分支
        required: true
        default: "v26.2.1"
        options:
        - v26.11.0-trunk.11
        - v26.8.0-trunk.424
        - v26.5.1
        - v26.2.1
        - v26.2.0-trunk.890
        - v25.11.1
        - main
        
        
jobs:
  armbian_build_core:
    name: armbian-"${{ matrix.RELEASE }}"-"${{ matrix.TYPE }}"-固件编译
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        RELEASE:
          # - focal # Ubuntu 20.04 LTS
          # - jammy # Ubuntu 22.04 LTS
          - noble # Ubuntu 24.04 LTS
          #- oracular # Ubuntu 24.10
          - plucky # Ubuntu 25.04
          # - buster # Debian 10
          # - bullseye # Debian 11
          - bookworm # Debian 12
          - trixie # Debian 13
          #- sid # Debian unstable
        TYPE:
          - minimal
          - server
          #- xfce
          
    steps:
      - uses: armbian/build@v26.2.1
        with:
          armbian_token:    "${{ secrets.GITHUB_TOKEN }}"  # GitHub token
          armbian_release:    "${{ matrix.RELEASE }}"                        # userspace
          armbian_target:    "build"                        # build=image, kernel=kernel
          armbian_board:    "onecloud"                   # build target
          armbian_branch:    "${{ inputs.branch_version }}"
          armbian_kernel_branch:    "current"
          armbian_ui:    "${{ matrix.TYPE }}"
          armbian_artifacts:    "build/output/images/"
          armbian_compress:    "sha,img,xz"
          armbian_release_title:    "Armbian image 玩客云三代(WS1608)官方镜像"
