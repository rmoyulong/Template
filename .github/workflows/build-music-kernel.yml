name: 编译音乐Linux（PREEMPT_RT）-7.3.x

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "构建 bzImage 和内核模块（false = 仅进行配置检查）"
        required: true
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-daphile-kernel.yml"
      - "kernel_config_migration_7.3.x/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ARCH: x86
      BUILD_JOBS: 2
      KERNEL_VERSION: "7.3.4"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖项
        run: |
          set -euo pipefail
          
            echo "===== APT UPDATE WITH RETRIES ====="
            for attempt in 1 2 3 4 5; do
              echo "APT update attempt: $attempt"
              
              if sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update; then
                break
              fi
              
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::APT update failed after 5 attempts"
                exit 1
              fi
              
              sleep 20
            done
            
            echo "===== INSTALL BUILD DEPENDENCIES ====="
            sudo apt-get install -y \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              build-essential \
              libncurses-dev \
              bison \
              flex \
              libssl-dev \
              libelf-dev \
              bc \
              xz-utils \
              zstd \
              cpio \
              dwarves \
              kmod \
              perl \
              python3 \
              rsync \
              wget \
              git

      - name: 配置 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-${KERNEL_VERSION}-x86_64-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            linux-${KERNEL_VERSION}-x86_64-${{ runner.os }}-

      - name: 下载内核源码
        run: |
          set -euo pipefail
          # 主版本号自动推导，绝不能把 v6.x / v7.x 写死：
          # 7.x 内核位于 v7.x/ 目录下，写死 v6.x 会直接 404
          # （这正是"7.4 下载不下来"的根因）。
          MAJOR="${KERNEL_VERSION%%.*}"
          BASE="https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x"
          # 候选版（-rc）放在 testing/ 子目录，正式版在上一层
          case "$KERNEL_VERSION" in
            *-rc*) BASE="$BASE/testing" ;;
          esac
          URL="$BASE/linux-${KERNEL_VERSION}.tar.xz"
          echo "下载地址: $URL"
          wget -q "$URL"
          tar -xJf "linux-${KERNEL_VERSION}.tar.xz"
          ls -d "linux-${KERNEL_VERSION}"

      - name: 加载最终内核配置
        run: |
          cd "linux-${KERNEL_VERSION}"
          MIGRATION_DIR="$GITHUB_WORKSPACE/kernel_config_migration_7.3.x"
          cp "$MIGRATION_DIR/config-7.3.x-rt-mod-daphile-final.conf" .config
          
          # Apply confirmed Daphile configuration.
          
          echo
          echo "===== APPLY CONFIRMED CONFIGURATION ====="
          
          ./scripts/config --enable EXPERT
          ./scripts/config --enable X86_64
          ./scripts/config --enable SMP
          ./scripts/config --enable PCI
          ./scripts/config --enable INPUT
          ./scripts/config --enable MODULES
          ./scripts/config --enable MODULE_UNLOAD
          
          # PREEMPT_RT.
          
          ./scripts/config --enable PREEMPT_RT
          ./scripts/config --enable HIGH_RES_TIMERS
          
          # ALSA core: built-in.
          
          ./scripts/config --enable SOUND
          ./scripts/config --enable SND
          ./scripts/config --enable SND_PCM
          ./scripts/config --enable SND_TIMER
          ./scripts/config --enable SND_HRTIMER
          ./scripts/config --enable SND_ALOOP
          ./scripts/config --enable SND_PCI
          
          # Intel HDA stack: modules.
          
          ./scripts/config --module SND_HDA
          ./scripts/config --module SND_HDA_CORE
          ./scripts/config --module SND_HDA_INTEL
          ./scripts/config --module SND_HDA_GENERIC
          ./scripts/config --module SND_HDA_CODEC_REALTEK
          ./scripts/config --module SND_HDA_CODEC_HDMI
          ./scripts/config --module SND_INTEL_DSP_CONFIG
          
          # Kernel compression: ZSTD.
          
          ./scripts/config --enable KERNEL_ZSTD
          
          # Kernel version suffix.
          # Set suffix ONLY in .config.
          # Do NOT pass LOCALVERSION to make later.
         
          # Resolve Kconfig dependencies.
          
          echo
          echo "===== KCONFIG OLDDEFCONFIG ====="
          
          make olddefconfig

      - name: 仅构建配置
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_modules == false }}
        run: |
          mkdir -p config-only
          cp "linux-${KERNEL_VERSION}/.config" config-only/config
          tar -czf config-only.tar.gz -C config-only config

      - name: 构建内核镜像及模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        run: |
          cd "linux-${KERNEL_VERSION}"
          export CC="ccache gcc"
          ccache -M 2G
          make ARCH=x86 -j"${BUILD_JOBS}" bzImage modules
          
      # 安装编译好的内核模块到暂存目录
      - name: 安装内核模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/linux-${KERNEL_VERSION}"
          MODULES_STAGING="$GITHUB_WORKSPACE/modules-staging"

          KERNEL_RELEASE=$(make -s -C "$KERNEL_DIR" ARCH=x86 kernelrelease)

          echo "Kernel release: $KERNEL_RELEASE"
          echo "Modules staging: $MODULES_STAGING"

          make -C "$KERNEL_DIR" \
            ARCH=x86 \
            INSTALL_MOD_PATH="$MODULES_STAGING" \
            modules_install

          # 供后续步骤使用
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"
          echo "MODULES_STAGING=$MODULES_STAGING" >> "$GITHUB_ENV"

          echo "=== Installed modules ==="
          ls -lah "$MODULES_STAGING/lib/modules/$KERNEL_RELEASE"

      # 打包内核模块
      - name: 打包内核模块
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MODULE_DIR="$MODULES_STAGING/lib/modules/$KERNEL_RELEASE"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-files"

          mkdir -p "$RELEASE_DIR"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "::error::Module directory not found: $MODULE_DIR"
            exit 1
          fi

          echo "=== Module directory ==="
          du -sh "$MODULE_DIR"

          echo "=== Disk space ==="
          df -h "$GITHUB_WORKSPACE"

          # 保留 ${KERNEL_VERSION} 目录层级
          tar --numeric-owner -zcf "$RELEASE_DIR/modules.tar.gz" \
            -C "$MODULES_STAGING/lib/modules" \
            "$KERNEL_RELEASE"

          echo "=== Package result ==="
          ls -lh "$RELEASE_DIR/modules.tar.gz"

      # 准备 Release 文件
      - name: 准备发布文件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/linux-${KERNEL_VERSION}"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-files"

          mkdir -p "$RELEASE_DIR"

          test -f "$KERNEL_DIR/arch/x86/boot/bzImage"
          test -f "$KERNEL_DIR/.config"

          cp "$KERNEL_DIR/arch/x86/boot/bzImage" \
             "$RELEASE_DIR/bzImage"

          cp "$KERNEL_DIR/.config" \
             "$RELEASE_DIR/config"

          echo "=== Release files ==="
          ls -lh "$RELEASE_DIR"

      # 检查发布文件
      - name: 检查发布文件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/release-files"

          test -s bzImage
          test -s config
          test -s modules.tar.gz

          echo "=== SHA256 ==="
          sha256sum bzImage config modules.tar.gz
          
      # 创建 GitHub Release
      - name: 创建发布并上传
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_modules != false }}
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: music-linux-7.3.x
          name: music-linux-${{ env.KERNEL_VERSION }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "release-files/bzImage,release-files/config,release-files/modules.tar.gz"
          body: | 
            音乐 Linux ${{ env.KERNEL_VERSION }} x86_64 PREEMPT_RT 构建版本.
            上传清单:
            - `bzImage`: Linux 内核映像
            - `config`: 最终内核配置
            - `modules.tar.gz`: 已安装的内核模块
            - 内核版本：${{ env.KERNEL_VERSION }} 