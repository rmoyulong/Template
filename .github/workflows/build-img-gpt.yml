name: 编译Bootable IMG(rootfs+modules+bzImage)-GPT

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (must match modules/bzImage)'
        required: false
        default: '7.3.3'
  push:
    tags:
      - 'img-*'

permissions:
  contents: write

env:
  # 仅作兜底展示；真实版本号由 modules.tar.gz 内的目录名自动识别（如 7.3.3-rt）
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.3.3' }}
  # 从 4096 提升到 6144，给 rootfs + 运行期 apt 留足空间，避免写满产生半截缓存
  IMG_SIZE_MB: 6144
  WORK_DIR: ${{ github.workspace }}/work
  IMG_FILE: ${{ github.workspace }}/work/debian-rootfs.img
  ROOTFS_URL: https://github.com/rmoyulong/Template/releases/download/rootfs-trixie-latest/rootfs.tar.gz
  # 默认用「模块化」内核（带真实 .ko）。若要用「全内建」内核，
  # 把下面两个 URL 末尾的 -%E6%A8%A1%E5%9D%97%E5%8C%96（-模块化）去掉即可。
  MODULES_URL: https://github.com/rmoyulong/Template/releases/download/kernel-modules-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8-%E6%A8%A1%E5%9D%97%E5%8C%96/modules.tar.gz
  # 真实内核配置（由 build-kernel 产出，随 kernel-image release 一起发布）。
  # 放进 /boot/config-$KVER 后，initramfs 的 MODULES=dep 才能正确判断
  # "哪些驱动已经内建、根设备根本不需要模块"，从而把 initramfs 做到最小。
  CONFIG_URL: https://github.com/rmoyulong/Template/releases/download/kernel-image-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8-%E6%A8%A1%E5%9D%97%E5%8C%96/config-rt-mod.txt
  BZIMAGE_URL: https://github.com/rmoyulong/Template/releases/download/kernel-image-RT%E5%AE%9E%E6%97%B6%E5%86%85%E6%A0%B8-%E6%A8%A1%E5%9D%97%E5%8C%96/bzImage

jobs:
  build-img:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          # grub-efi-ia32-bin：宿主机侧 32 位 EFI 回退需要
          sudo apt-get install -y \
            wget parted e2fsprogs dosfstools \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub-common \
            mtools xorriso rsync dos2unix

      - name: Download rootfs, modules, bzImage
        run: |
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          wget -q -O rootfs.tar.gz "$ROOTFS_URL"
          wget -q -O modules.tar.gz "$MODULES_URL"
          wget -q -O bzImage "$BZIMAGE_URL"
          # 真实内核配置：MODULES=dep 要靠它判断哪些驱动已内建；拿不到则回退 most
          wget -q -O config-rt-mod.txt "$CONFIG_URL" || echo "WARN: config 下载失败，将回退 MODULES=most"
          ls -lh

      - name: Create disk image and partitions
        run: |
          cd "$WORK_DIR"
          dd if=/dev/zero of="$IMG_FILE" bs=1M count=$IMG_SIZE_MB status=progress

          parted -s "$IMG_FILE" mklabel gpt
          parted -s "$IMG_FILE" mkpart biosboot 1MiB 3MiB
          parted -s "$IMG_FILE" set 1 bios_grub on
          parted -s "$IMG_FILE" mkpart efi fat32 3MiB 103MiB
          parted -s "$IMG_FILE" set 2 esp on
          parted -s "$IMG_FILE" mkpart root ext4 103MiB 100%

          LOOP=$(sudo losetup --find --show --partscan "$IMG_FILE")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sleep 2
          lsblk "$LOOP"

          sudo mkfs.fat -F32 "${LOOP}p2"
          sudo mkfs.ext4 -F -L rootfs "${LOOP}p3"

          # 提前导出根分区 UUID，写入 grub.cfg / fstab 做双保险
          ROOTFS_UUID=$(sudo blkid -s UUID -o value "${LOOP}p3")
          echo "ROOTFS_UUID=$ROOTFS_UUID" >> "$GITHUB_ENV"
          echo "根分区 UUID: $ROOTFS_UUID"

      - name: Populate rootfs
        run: |
          set -euo pipefail

          LOOP="${{ env.LOOP }}"
          sudo mkdir -p /mnt/rootfs /mnt/efi
          sudo mount "${LOOP}p3" /mnt/rootfs
          sudo mount "${LOOP}p2" /mnt/efi

          # 解压 rootfs，保留完整权限、符号链接与扩展属性
          #   --acls --xattrs：必须与 build-rootfs.yml 的打包参数（--acls --xattrs）对应，
          #   否则 xattr 丢失，依赖 file capability 的程序会失效（例如 ping 需要 cap_net_raw）。
          sudo tar -xzf "$WORK_DIR/rootfs.tar.gz" -C /mnt/rootfs \
            --numeric-owner --acls --xattrs

          # 清掉 rootfs 中可能残留的损坏 apt 缓存（避免烧录后 apt 解析报错）
          sudo rm -rf /mnt/rootfs/var/lib/apt/lists/* || true

          ###################################################
          #/mnt子目录
          sudo mkdir -p /mnt/rootfs/mnt/aliyundrive /mnt/rootfs/mnt/boot /mnt/rootfs/mnt/rootfs /mnt/rootfs/mnt/music
          sudo mkdir -p /mnt/rootfs/mnt/sd /mnt/rootfs/mnt/usb /mnt/rootfs/mnt/NAS

          #samba配置
          #sudo mkdir -p "/mnt/rootfs/etc/samba"
          sudo cp ${{ github.workspace }}/patch/smb.conf /mnt/rootfs/etc/samba/smb.conf
          cat "/mnt/rootfs/etc/samba/smb.conf"

          #修改为中国时间
          sudo rm -rf /mnt/rootfs/etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Shanghai /mnt/rootfs/etc/localtime
          
          #中文环境配置
          #sudo mkdir -p "/mnt/rootfs/etc/default"
          sudo cp ${{ github.workspace }}/patch/locale.conf /mnt/rootfs/etc/locale.conf
          sudo cp ${{ github.workspace }}/patch/locale.gen /mnt/rootfs/etc/locale.gen
          cat "/mnt/rootfs/etc/default/locale.conf"
          cat "/mnt/rootfs/etc/locale.gen"
          ###################################################          
          
          #####添加当前系统rootfs自动扩容脚本
          sudo cp ${{ github.workspace }}/patch/resize_rootfs.sh /mnt/rootfs/root/resize_rootfs.sh
          sudo chmod 755 /mnt/rootfs/root/resize_rootfs.sh
          ###################
          ########让 ls 有颜色
          sudo cp ${{ github.workspace }}/patch/.bashrc /mnt/rootfs/root/.bashrc
          sudo chmod 0644 /mnt/rootfs/root/.bashrc
          ###################
          
          # 放入安装脚本（GPT 版，两份）
          #   /root/install.sh      ← patch/install-gpt.sh       （rsync 当前系统整机到目标盘）
          #   /root/install-plus.sh ← patch/install-gpt-plus.sh  （解压 /root/rootfs.tar.gz）
          sudo mkdir -p /mnt/rootfs/root
          sudo chmod 700 /mnt/rootfs/root
          for pair in \
            "${{ github.workspace }}/patch/install-gpt.sh:/mnt/rootfs/root/install.sh" \
            "${{ github.workspace }}/patch/install-gpt-plus.sh:/mnt/rootfs/root/install-plus.sh"; do
            src="${pair%%:*}"; dst="${pair##*:}"
            if [ -f "$src" ]; then
              sudo cp "$src" "$dst"
              sudo chmod 755 "$dst"
              sudo sed -i 's/\r$//' "$dst"
              echo "=== 已放入 $dst（来源：$src） ==="
            else
              echo "WARN: $src 不存在，跳过"
            fi
          done
          sudo ls -l /mnt/rootfs/root/ || true

          # 解压 modules 到临时目录
          rm -rf /tmp/modules-extract
          mkdir -p /tmp/modules-extract
          sudo tar -xzf "$WORK_DIR/modules.tar.gz" -C /tmp/modules-extract

          # 版本号不写死：直接读包内顶层目录名（如 7.3.3-rt）
          #   若给模块化版单独设了 LOCALVERSION（如 -rt-mod），这里会自动识别
          KVER=""
          for d in /tmp/modules-extract/*/; do
            [ -d "$d" ] || continue
            KVER="$(basename "$d")"
            break
          done
          case "$KVER" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "ERROR: 无法从 modules.tar.gz 识别版本目录（读到: '${KVER}'）"
              echo "       包内顶层应为 7.3.3 / 7.3.3-rt 这类目录"
              ls -la /tmp/modules-extract
              exit 1
              ;;
          esac
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "检测到模块目录: $KVER"

          # 模块目录名必须与 uname -r 一致，否则新内核找不到自己的模块
          sudo mkdir -p /mnt/rootfs/lib/modules
          sudo rm -rf "/mnt/rootfs/lib/modules/$KVER"
          sudo mv "/tmp/modules-extract/$KVER" "/mnt/rootfs/lib/modules/$KVER"

          # 复核：模块目录名必须真的等于 uname -r，否则开机后所有模块（含 USB/键盘）加载失败
          test -d "/mnt/rootfs/lib/modules/$KVER" || { echo "ERROR: $KVER 模块目录缺失"; exit 1; }
          echo "模块就位: $(ls "/mnt/rootfs/lib/modules/$KVER" | tr '\n' ' ')"

          # 放置内核（文件名同样必须与 uname -r 一致）
          sudo mkdir -p /mnt/rootfs/boot
          sudo cp "$WORK_DIR/bzImage" "/mnt/rootfs/boot/vmlinuz-$KVER"
          ls -lh "/mnt/rootfs/boot/vmlinuz-$KVER"

      - name: Generate initramfs and install GRUB (chroot)
        run: |
          LOOP="${{ env.LOOP }}"
          ROOTFS_UUID="${{ env.ROOTFS_UUID }}"

          # 真实版本号：优先用上一步导出的 KVER；缺失时从镜像内已有的内核文件名反查
          KVER="${{ env.KVER }}"
          if [ -z "$KVER" ]; then
            for f in /mnt/rootfs/boot/vmlinuz-*; do
              [ -f "$f" ] || continue
              KVER="${f##*/vmlinuz-}"
              break
            done
          fi
          if [ -z "$KVER" ]; then
            echo "ERROR: 无法确定内核版本号"
            exit 1
          fi
          echo "使用内核版本: $KVER"

          # 提前创建 EFI 挂载点，避免后续挂载异常
          sudo mkdir -p /mnt/rootfs/dev /mnt/rootfs/proc /mnt/rootfs/sys /mnt/rootfs/boot/efi

          sudo mount --bind /dev  /mnt/rootfs/dev
          sudo mount --bind /proc /mnt/rootfs/proc
          sudo mount --bind /sys  /mnt/rootfs/sys
          # EFI 分区直接 bind 进 chroot，避免 chroot 内重复挂载冲突
          sudo mount --bind /mnt/efi /mnt/rootfs/boot/efi

          # 检查必要工具
          if [ ! -x /mnt/rootfs/usr/sbin/update-initramfs ]; then
            echo "ERROR: rootfs 中没有 update-initramfs"
            exit 1
          fi
          if [ ! -x /mnt/rootfs/sbin/depmod ]; then
            echo "ERROR: rootfs 中没有 depmod"
            exit 1
          fi

          # ---------- initramfs 策略（决定开机快慢的关键）----------
          # 之前这里只写了一个仅含 CONFIG_RD_GZIP=y 的"假 config"。initramfs-tools
          # 的 MODULES=dep 需要真实 /boot/config-$KVER 才知道哪些驱动已经内建，
          # 假 config 判断不准，所以当时只能退而用 most —— 把 /lib/modules 下
          # 所有模块全塞进 initramfs。J1900 这类机器开机最早期要整体解压它，
          # 这正是"同一台机器启动很慢"的主因。现在改用 build-kernel 的真实配置。
          if [ -f "$WORK_DIR/config-rt-mod.txt" ]; then
            sudo cp "$WORK_DIR/config-rt-mod.txt" "/mnt/rootfs/boot/config-$KVER"
            MODULES_MODE=dep
            echo "已放入真实内核配置 → 采用 MODULES=dep（initramfs 最小化）"
          else
            sudo tee "/mnt/rootfs/boot/config-$KVER" > /dev/null <<'CFGEOF'
          CONFIG_RD_ZSTD=y
          CFGEOF
            MODULES_MODE=most
            echo "WARN: 未取到真实 config，回退 MODULES=most（initramfs 会偏大）"
          fi

          sudo mkdir -p /mnt/rootfs/etc/initramfs-tools
          # MODULES=dep：只放入挂载根设备真正需要的模块。本内核已把 SATA、USB
          #   控制器、USB 存储、键鼠 HID、VT 控制台、ext4 全部内建，所以这里
          #   几乎什么都不用放 → initramfs 极小、开机极快。无线/声卡等 =m 驱动
          #   改由 udev 在根分区挂载之后再加载。
          # COMPRESS=zstd：initramfs 自身也用 zstd（内核默认带 CONFIG_RD_ZSTD=y
          #   解压支持），解压速度约为 gzip 的 2~3 倍。
          # FRAMEBUFFER=y：initramfs 阶段启用帧缓冲控制台（Plymouth 需要）。
          # 想回到"大而全"的旧行为：把 MODULES 改回 most 即可。
          sudo tee /mnt/rootfs/etc/initramfs-tools/initramfs.conf > /dev/null <<CONFEOF
          MODULES=${MODULES_MODE}
          COMPRESS=zstd
          FRAMEBUFFER=y
          CONFEOF

          # depmod 和 initramfs
          sudo chroot /mnt/rootfs /bin/bash -c "depmod -a $KVER"
          sudo chroot /mnt/rootfs /bin/bash -c "update-initramfs -c -k $KVER"

          if [ ! -f "/mnt/rootfs/boot/initrd.img-$KVER" ]; then
            echo "ERROR: initramfs 生成失败"
            exit 1
          fi
          echo "initramfs 生成成功"

          # fstab：LABEL + UUID 双配置兜底
          sudo tee /mnt/rootfs/etc/fstab > /dev/null <<EOF
          LABEL=rootfs  /  ext4  errors=remount-ro  0  1
          UUID=${ROOTFS_UUID}  /  ext4  errors=remount-ro  0  1
          EOF

          # 安装 GRUB 及运行期必备工具
          # 强制非交互：避免 debconf Dialog 回退 Readline 后在 chroot 里卡死
          echo "=== 安装 GRUB 软件包 ==="
          sudo chroot /mnt/rootfs /usr/bin/env \
            DEBIAN_FRONTEND=noninteractive \
            DEBCONF_NONINTERACTIVE_SEEN=true \
            bash -c '
              apt-get update || true
              apt-get install -y --no-install-recommends \
                grub-pc grub-efi-amd64 grub-efi-ia32 \
                parted dosfstools e2fsprogs rsync \
                fake-hwclock systemd-timesyncd \
                usbutils pciutils evtest kbd || true
              apt-get clean
              rm -rf /var/lib/apt/lists/*
            '

          # 启用开机校时（工控板 RTC 掉电后时间复位，靠这两者兜底）
          sudo chroot /mnt/rootfs systemctl enable systemd-timesyncd || true
          sudo chroot /mnt/rootfs systemctl enable fake-hwclock || true

          # chroot 内安装 GRUB（BIOS + 64 位 EFI + 32 位 EFI）
          # --force 确保 GPT 的 BIOS Boot 分区也写入引导代码
          echo "=== chroot 内安装 GRUB ==="
          sudo chroot /mnt/rootfs /bin/bash -c "
            grub-install --target=i386-pc --recheck --force ${LOOP} || true
            grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=debian --recheck || true
            grub-install --target=i386-efi  --efi-directory=/boot/efi --bootloader-id=debian --recheck || true
          "

          # 如果 chroot 失败，宿主机回退（BIOS 模式）
          if [ ! -f /mnt/rootfs/boot/grub/i386-pc/normal.mod ]; then
            echo "chroot grub-install 失败，使用宿主机 grub 回退 BIOS 部分"
            sudo grub-install --target=i386-pc --boot-directory=/mnt/rootfs/boot --force "${LOOP}" || true
          fi

          # 手动写 grub.cfg，LABEL + UUID 双根参数
          # 默认项带 quiet splash（Plymouth 开机画面）；recovery 项不带 splash，便于排查启动问题
          # ★ insmod all_video + gfxpayload=keep：让 GRUB 设置图形模式，内核才能拿到帧缓冲，
          #   Plymouth 才有画布（UEFI 走 GOP，传统 BIOS 走 VBE）。
          # ★ console=tty1：控制台钉在 tty1；loglevel=3：压掉驱动刷屏，登录提示符不被冲走。
          echo "=== 写入 grub.cfg ==="
          sudo mkdir -p /mnt/rootfs/boot/grub
          sudo tee /mnt/rootfs/boot/grub/grub.cfg > /dev/null <<EOF
          set default=0
          # 开机菜单停留 5 秒（与 rootfs 的 GRUB_TIMEOUT=5 保持一致，避免 update-grub 后被改回）
          set timeout=5
          insmod all_video
          set gfxmode=auto
          set gfxpayload=keep

          menuentry "Debian ${KVER}" {
              linux /boot/vmlinuz-${KVER} root=LABEL=rootfs root=UUID=${ROOTFS_UUID} rw quiet splash loglevel=3 console=tty1 vt.global_cursor_default=0 pcie_aspm=off
              initrd /boot/initrd.img-${KVER}
          }
          menuentry "Debian ${KVER} (recovery)" {
              linux /boot/vmlinuz-${KVER} root=LABEL=rootfs root=UUID=${ROOTFS_UUID} rw single console=tty1
              initrd /boot/initrd.img-${KVER}
          }
          EOF

          # Plymouth 生效性检查：initramfs 里必须含 plymouth，splash 才有画面
          if sudo chroot /mnt/rootfs /bin/bash -c "lsinitramfs /boot/initrd.img-$KVER 2>/dev/null | grep -q plymouth"; then
            echo "Plymouth 已打入 initramfs ✅"
          else
            echo "WARN: initramfs 内未发现 plymouth，开机画面会退回纯文字（请确认 rootfs 装过 plymouth）"
          fi

          # 把 grub.cfg 同步到所有 EFI 引导目录，避免部分主板读不到配置
          sudo cp /mnt/rootfs/boot/grub/grub.cfg /mnt/efi/EFI/debian/grub.cfg 2>/dev/null || true
          sudo cp /mnt/rootfs/boot/grub/grub.cfg /mnt/efi/EFI/BOOT/grub.cfg 2>/dev/null || true

          # 确保 EFI 分区里有 fallback 引导文件
          echo "=== 检查并复制 EFI 引导文件 ==="
          sudo mkdir -p /mnt/efi/EFI/BOOT
          if [ -d /mnt/efi/EFI/debian ]; then
            sudo cp -r /mnt/efi/EFI/debian/* /mnt/efi/EFI/BOOT/ 2>/dev/null || true
            if [ -f /mnt/efi/EFI/BOOT/grubia32.efi ]; then
              sudo cp /mnt/efi/EFI/BOOT/grubia32.efi /mnt/efi/EFI/BOOT/BOOTIA32.EFI
            fi
            if [ -f /mnt/efi/EFI/BOOT/grubx64.efi ]; then
              sudo cp /mnt/efi/EFI/BOOT/grubx64.efi /mnt/efi/EFI/BOOT/BOOTX64.EFI
            fi
          fi

          echo "=== 最终的 EFI 目录结构 ==="
          sudo find /mnt/efi/EFI -type f || true

          # 按顺序卸载所有 bind 挂载，避免设备忙
          sudo umount /mnt/rootfs/boot/efi || true
          sudo umount /mnt/rootfs/dev  || true
          sudo umount /mnt/rootfs/proc || true
          sudo umount /mnt/rootfs/sys  || true

      - name: Cleanup and unmount
        run: |
          LOOP="${{ env.LOOP }}"
          sudo umount /mnt/rootfs || true
          sudo umount /mnt/efi || true
          sudo losetup -d "$LOOP" || true

      - name: Compress image
        run: |
          cd "$WORK_DIR"
          gzip -9 -k "$IMG_FILE"
          ls -lh
          ( cd "$WORK_DIR" && sha256sum debian-rootfs.img.gz > debian-rootfs.img.gz.sha256 )

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          tag: image-debian-7-latest
          name: image-debian-7-latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            ${{ env.WORK_DIR }}/debian-rootfs.img.gz
            ${{ env.WORK_DIR }}/debian-rootfs.img.gz.sha256
          body: |
            可启动 Debian IMG（支持 32 位 / 64 位 UEFI + BIOS 启动）
            分区表为 GPT
            内核：${{ env.KVER }}
            rootfs：Debian trixie + SSH/FTP/Nginx/PHP8/LMS
            初始 root 密码：1234（首次 SSH 登录强制改密）
            ```
            ## 使用 rufus 写入 U 盘或硬盘
            ## 将系统安装到机器硬盘（U 盘启动后运行）镜像内已提供两份安装脚本： 
            ## 两者都会从当前 U 盘系统补入内核与 modules；
            1) rsync 版：直接把当前 U 盘系统整机同步到内部硬盘
            sudo sh /root/install.sh
            ```
            2) rootfs.tar.gz 版：需自备 rootfs.tar.gz
            镜像未内嵌该包（内嵌会让镜像体积翻倍），请自行放到 U 盘系统的 /root/ 下：
            # 本机可联网时直接下载（也可用 scp 从别处传入 /root/rootfs.tar.gz）
            sudo wget -O /root/rootfs.tar.gz ${{ env.ROOTFS_URL }}
            sudo sh /root/install-plus.sh
            # 也可显式指定其它压缩包路径：
            # sudo sh /root/install-plus.sh /path/to/rootfs.tar.gz
            ```