name: 构建 Linux 内核 - x86_64

on:
  workflow_dispatch:  # 允许在 Actions 页面手动触发

env:
  kernel_Version: 6.12.115

jobs:
  union_core:
    name: ${{ matrix.config_type }} 固件编译
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config_type:
          - 普通内核
          - RT实时内核 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装构建依赖项
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc

      - name: 下载内核源码
        run: |
          # 以 ${{ env.kernel_Version }} 为例，你可以替换成想要编译的版本号
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ env.kernel_Version }}.tar.xz
          tar -xJf linux-${{ env.kernel_Version }}.tar.xz
          cd linux-${{ env.kernel_Version }}

      - name: 配置内核
        working-directory: linux-${{ env.kernel_Version }}
        run: |
          if [[ "${{ matrix.config_type }}" == "RT实时内核" ]]; then
             # 基础配置（这已经是一个能启动的、功能较全的 x86_64-rt配置）
            cp ${{ github.workspace }}/patch/j1900andj1800-RT kernel/.config
          else
            # 基础配置（这已经是一个能启动的、功能较全的 x86_64 配置）
            cp ${{ github.workspace }}/patch/j1900andj1800 kernel/.config 
          fi  
          
          #让内核自动处理所有依赖关系
          make olddefconfig           

      - name: 构建内核与模块
        working-directory: linux-${{ env.kernel_Version }}
        run: |
          make -j$(nproc)

      - name: 将模块安装至暂存目录
        working-directory: linux-${{ env.kernel_Version }}
        run: |
          # 关键一步：把编译好的模块装到临时目录，而不是 /usr/lib/modules/
          
          #/usr/lib/modules/6.12.xxx，任务一结束就没了，你也拿不到。所以必须用 INSTALL_MOD_PATH 指定一个工作区内的临时路径modules-staging
          mkdir -p ${{ github.workspace }}/modules-staging
          make INSTALL_MOD_PATH=${{ github.workspace }}/modules-staging modules_install

      - name: 打包内核模块
        run: |
          cd ${{ github.workspace }}/modules-staging/lib/modules     
          sudo tar zcvfp ../modules.tar.gz .
          ls -lh
          
      - name: 上传内核镜像
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag:  kernel-image-${{ matrix.config_type }}
          body: |
            ====================🧊固件信息🧊=======================
            ➦ 💻 固件平台：x86-64-linux
            ➦ ⚽ 固件源码：https://cdn.kernel.org/
            ➦ 🚀 内核版本：${{ env.kernel_Version }}
          artifacts: linux-${{ env.kernel_Version }}/arch/x86/boot/bzImage

      - name: 上传内核模块
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag:  kernel-modules-${{ matrix.config_type }}
          body: |
            ====================🧊固件信息🧊=======================
            ➦ 💻 固件平台：x86-64-linux
            ➦ ⚽ 固件源码：https://cdn.kernel.org/
            ➦ 🚀 内核版本：${{ env.kernel_Version }}
          artifacts: ${{ github.workspace }}/modules-staging/lib/modules.tar.gz       
