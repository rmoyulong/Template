name: Audit Daphile 6.12.30 Config Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daphile-6.12.30-config-audit
  cancel-in-progress: false

jobs:
  audit-config:
    name: Generate and audit candidate config (no kernel build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install config-generation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc perl python3 rsync
      - name: Download exact upstream Linux 6.12.30
        run: |
          set -euo pipefail
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.30.tar.xz
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc
          grep 'linux-6.12.30.tar.xz$' sha256sums.asc | sha256sum -c -
          tar -xJf linux-6.12.30.tar.xz
          test "$(make -s -C linux-6.12.30 kernelversion)" = "6.12.30"
      - name: Generate candidate and audit (no compilation)
        env:
          AUDIT_OUT: ${{ github.workspace }}/daphile-config-audit
        run: |
          set -euo pipefail
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "Audit output: $AUDIT_OUT"
          cd "$GITHUB_WORKSPACE/linux-6.12.30"
          bash ../6.12.30-daphile/reconstruct-daphile-6.12.30-config.sh
          echo "===== AUDIT OUTPUT FILES ====="
          find "$AUDIT_OUT" -maxdepth 2 -type f -print | sort
          test -s "$AUDIT_OUT/config.candidate"
          test -s "$AUDIT_OUT/config.sha256"
          test -s "$AUDIT_OUT/audit-report.txt"
      - name: Diagnose audit output directory
        if: always()
        run: |
          set +e
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "===== EXPECTED OUTPUT ====="
          ls -la "$GITHUB_WORKSPACE/daphile-config-audit"
          echo "===== SEARCH FOR AUDIT FILES ====="
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name 'config.candidate' -print
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name 'audit-report.txt' -print
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name 'config.sha256' -print
          echo "===== DIRECTORY TREE ====="
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name '*audit*' -print
      - name: Upload config audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daphile-6.12.30-config-audit
          path: ${{ github.workspace }}/daphile-config-audit/
          if-no-files-found: warn
          retention-days: 30
