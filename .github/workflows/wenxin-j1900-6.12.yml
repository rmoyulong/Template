name: Build RT Kernel 6.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  kernel_Version: 6.12.115
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev flex bison \
            libssl-dev bc dwarves git cpio xz-utils

      - name: Clone kernel
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ env.kernel_Version }}.tar.xz
          tar -xJf linux-${{ env.kernel_Version }}.tar.xz
          mkdir -p kernel
          cp -rfp linux-${{ env.kernel_Version }}/* kernel

      - name: Configure
        run: |
          cp ${{ github.workspace }}/patch/j1900andj1800-RT kernel/.config
          cd kernel
          make olddefconfig
          scripts/config --enable PREEMPT_RT
          scripts/config --enable HZ_1000
          # 禁用导致报错的证书选项
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          
          make olddefconfig

      - name: Build
        run: |
          cd kernel
          make -j$(nproc) bzImage
          make -j$(nproc) modules

      - name: Package
        run: |
          cd kernel
          mkdir -p output
          cp arch/x86/boot/bzImage output/
          make INSTALL_MOD_PATH=output modules_install
          tar -czf kernel-rt-6.12.tar.gz -C output.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rt-6.12
          path: kernel/kernel-rt-6.12.tar.gz
          
      - name: 打包上传内核+驱动模块压缩包
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag:  6.12-linux-rt压缩包
          body: |
            ====================🧊固件信息🧊=======================
            ➦ 💻 固件平台：x86-64-linux
            ➦ ⚽ 固件源码：https://cdn.kernel.org/ && https://github.com/torvalds/
            ➦ 🚀 内核版本：${{ env.kernel_Version }}
          artifacts: kernel/kernel-rt-6.12.tar.gz           
